<!DOCTYPE html>
<html lang="ko">
<head>
<script src="organization-data.js"></script><script src="seed-data.js"></script><script src="preview-runtime.js"></script><link rel="stylesheet" href="preview.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개인 명세 · 지사 포털</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .picker { display:flex; align-items:center; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
    .picker select { padding:10px 14px; border:1.5px solid var(--line-2); border-radius:10px; font-size:0.95rem; font-family:inherit; font-weight:600; }
    .stmt-head { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
    .stmt-head .avatar { width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg,#ff8534,var(--brand)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.3rem; }
    .stmt-head h2 { font-size:1.3rem; font-weight:800; letter-spacing:-0.5px; }
    .stmt-head .role { color:var(--text-soft); font-size:0.88rem; }
    .note2 { color:var(--text-mute); font-size:0.8rem; margin-top:14px; }
    .big1 { margin-bottom:22px; }
    .big2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:22px; }
    @media(max-width:560px){ .big2 { grid-template-columns:1fr; } }
    .bigcard { border-radius:16px; padding:20px 22px; }
    .bigcard.ik { background:linear-gradient(135deg,#fff3ea,#ffe3cc); border:1.5px solid var(--brand); }
    .bigcard.tot { background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm); }
    .bigcard .label { font-weight:700; font-size:0.9rem; }
    .bigcard.ik .label { color:var(--brand-dk); }
    .bigcard.tot .label { color:var(--text-soft); }
    .bigcard .value { font-size:2rem; font-weight:900; letter-spacing:-1.3px; margin-top:4px; }
    .bigcard.ik .value { color:#7a3d00; }
    .bigcard .value small { font-size:0.95rem; font-weight:700; }
      .ct-chips { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 14px; }
    .chip { background:var(--brand-sft); color:var(--brand-dk); border:1px solid #ffd9b8; border-radius:999px; padding:5px 12px; font-size:0.82rem; font-weight:700; }
    .tl-tbl th { white-space:nowrap; font-size:0.76rem; position:sticky; top:0; background:var(--surface); z-index:1; }
    .tl-tbl td { padding:6px 8px; font-variant-numeric:tabular-nums; }
    .tl-tbl tr.tl-cur td { background:#fff1e3; font-weight:600; }
    .tl-tbl tr.tl-past td { color:var(--text-mute); }
        .tl-small { font-size:0.74rem; }
    .tl-small td, .tl-small th { padding:4px 6px !important; }
    .tl-note { font-size:0.78rem; color:var(--text-mute); margin-top:10px; line-height:1.7; }
  </style>
<link rel="stylesheet" href="seoul-theme.css"></head>
<body>
  <div class="backdrop"></div>
  <aside class="sidebar" id="sidebar" data-active="statement"></aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
        <div>
          <h1>개인 명세</h1>
          <div class="sub">팀원별 본인 수수료·시책 명세</div>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="picker">
        <span style="font-weight:600;">팀원 선택</span>
        <select id="who"></select>
        <span style="font-weight:600;">달 선택</span>
        <select id="month"><option value="__live">이번 달</option></select>
      </div>
      <div id="stmt"></div>
    </div>
  </div>

  <script src="sidebar.js"></script>
  
  <script src="sb.js"></script>
  <script src="commission-core.js"></script>
  <script>
    const fmt = HW.fmt;
    const esc = s => String(s).replace(/</g,'&lt;');
    const sel = document.getElementById('who');
    const msel = document.getElementById('month');
    const mlabel = m => { const [y, mo] = m.split('-'); return `${y}년 ${Number(mo)}월`; };
    let liveState = null, snapByMonth = {};

    (async () => {
      await HW.load();
      liveState = { products: HW.state.products, people: HW.state.people, wolcho: HW.state.wolcho, share: HW.state.share, corpAdj: HW.state.corpAdj || {}, contracts: HW.state.contracts || [], bossShareTable: HW.state.bossShareTable };
      const auth = JSON.parse(localStorage.getItem('hwAuth') || 'null');
      const isBoss = auth && auth.role === 'boss';
      let people = HW.state.people;
      if (!isBoss) {
        if (auth && auth.personId) people = people.filter(p => p.id === auth.personId);   // 본인 명세만
        else people = people.filter(p => p.role === 'fc');                                 // 사원: 사원만 (지사장·지점장 비표시)
      }
      sel.innerHTML = people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
      if (!isBoss && auth && auth.personId) sel.disabled = true;
      sel.addEventListener('change', render);
      msel.addEventListener('change', render);
      render();

      // 과거 달 목록 — 실적 보관함에 매달 자동 저장되는 성적표(snap_YYYY-MM)를 재활용
      const cm = HW.monthKey();
      try {
        const { data } = await SB.from('app_config').select('key,value').like('key', 'snap_%');
        (data || []).forEach(r => {
          if (!r.value) return;
          const m = r.value.month || r.key.slice(5);
          if (m < cm) snapByMonth[m] = r.value;   // 이번 달은 실시간 데이터로 보므로 제외
        });
      } catch (e) {}
      const months = Object.keys(snapByMonth).sort().reverse();
      msel.innerHTML = `<option value="__live">이번 달</option>` +
        months.map(m => `<option value="${m}">${mlabel(m)}</option>`).join('');
    })();

    function computeFor(mv) {
      const v = mv === '__live' ? liveState : snapByMonth[mv];
      HW.state.products = v.products || [];
      HW.state.people = v.people || [];
      HW.state.wolcho = v.wolcho || {};
      HW.state.share = typeof v.share === 'number' ? v.share : liveState.share;
      HW.state.corpAdj = v.corpAdj || {};
      HW.state.contracts = v.contracts || [];
      HW.state.bossShareTable = typeof v.bossShareTable === 'number' ? v.bossShareTable : 75;
      return HW.compute();
    }

    function render() {
      const mv = msel.value || '__live';
      const mtxt = mv === '__live' ? '이번 달' : mlabel(mv);
      const r = computeFor(mv);
      const p = r.ppl.find(x => x.id === sel.value) || (mv === '__live' ? r.ppl[0] : null);
      if (!p) {
        document.getElementById('stmt').innerHTML =
          `<div class="panel"><div class="panel-body" style="padding:24px; color:var(--text-mute);">${mtxt}에는 이 팀원의 저장된 명세가 없습니다.</div></div>`;
        return;
      }
      const role = HW.roleText(p);
      // ===== 건별 입력 모드: 세금 · 쉐어까지 반영한 「실제 수령」 명세 (2026-10-01) =====
      const allSets = () => {
        const sets = [];
        Object.keys(snapByMonth).sort().forEach(mk => { const v = snapByMonth[mk]; if (v && (v.contracts || []).length) sets.push({ ym: mk, products: v.products, people: v.people, contracts: v.contracts, share: v.share, bossShareTable: v.bossShareTable }); });
        if ((liveState.contracts || []).length) sets.push({ ym: HW.monthKey(), products: liveState.products, people: liveState.people, contracts: liveState.contracts, share: liveState.share, bossShareTable: liveState.bossShareTable });
        return sets;
      };
      if (r.contractsMode && p.settle) {
        const S_ = p.settle, num = x => Math.abs(x) < 0.00005 ? '-' : fmt(x);
        // 이 달 계약의 익월분 + 과거 계약의 후속분 = 다음 달 총 수령 (2027년 6월부터는 후속분이 실제로 붙는다)
        const TLALL = HW.timeline(allSets());
        const curYm = mv === '__live' ? HW.monthKey() : mv, payYm = HW.addMonths(curYm, 1);
        const rec = (TLALL[p.name] || {})[payYm];
        const LT = rec ? rec.later : { fee: 0, si: 0, ov: 0, corp: 0 }, W = 10000;
        const laterG = (LT.fee + LT.si + LT.ov + LT.corp) / W;
        const T_ = rec ? { pre: rec.gross / W, tax: rec.tax / W, out: rec.out / W, inn: rec.inn / W, real: rec.real / W } : { pre: S_.pre, tax: S_.tax, out: S_.out, inn: S_.inn, real: S_.real };
        const mine = (HW.state.contracts || []).map((c, i) => ({ c, x: r.contractRows[i] })).filter(o => o.x && o.x.ok);
        const own = mine.filter(o => o.c.emp === p.id), got = mine.filter(o => o.x.lines.some(l => l.to === p.id));
        const money = n => Math.round(n).toLocaleString('ko-KR');
        const rowsCm = [
          ['영업 수수료', p.ikSoo, ''], ['개인시책', p.siIk, ''],
          ['오버라이딩', S_.ov, S_.ov ? '내 아래 계약에서 단계별 %p로 올라오는 몫' : ''],
          ...(p.role === 'boss' ? [['법인시책 (' + fmt(r.share) + '%)', S_.corp, '김태연 진행 계약 제외']] : []),
        ].filter(x => x[1] || x[0] === '영업 수수료');
        const hasOwn = S_.own > 0.00005 || S_.ov > 0.00005 || S_.corp > 0.00005;
        document.getElementById('stmt').innerHTML = `
          <div class="stmt-head">
            <div class="avatar">${esc(p.name.charAt(0))}</div>
            <div><h2>${esc(p.name)}</h2><div class="role">${role} · ${mtxt} 계약 ${own.length}건 · 월초성적 ${fmt(p.hwan)}만원</div></div>
          </div>
          <div class="big2">
            <div class="bigcard ik"><div class="label">📅 다음 달 실제 수령 (세금·쉐어 반영${laterG > 0.00005 ? ' · 과거 계약 후속분 포함' : ''})</div><div class="value">${fmt(T_.real)} <small>만원</small></div></div>
            <div class="bigcard tot"><div class="label">세전 합계 (전산에서 받는 돈)</div><div class="value">${fmt(T_.pre)} <small>만원</small></div></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>수령 내역</h2><span style="color:var(--text-mute);font-size:0.82rem;">단위: 만원 · 익월분</span></div>
            <div class="panel-body" style="overflow-x:auto;">
              <table class="tbl"><thead><tr><th>항목</th><th class="num">금액</th><th>설명</th></tr></thead><tbody>
                ${hasOwn ? rowsCm.map(([l, v, d]) => `<tr><td class="lbl">${l}</td><td class="num">${num(v)}</td><td style="color:var(--text-mute);font-size:0.82rem;">${d}</td></tr>`).join('') : ''}
                ${laterG > 0.00005 ? `<tr><td class="lbl" colspan="3" style="background:#f4f8ff;color:#1f3d7a;font-weight:700;">과거 계약의 후속분 (이 달에 같이 들어오는 돈)</td></tr>
                  <tr><td class="lbl">후속 수수료</td><td class="num">${num(LT.fee / W)}</td><td style="color:var(--text-mute);font-size:0.82rem;">13회차 이후 분할 지급분</td></tr>
                  <tr><td class="lbl">2차년도 시책</td><td class="num">${num(LT.si / W)}</td><td></td></tr>
                  <tr><td class="lbl">오버라이딩 (후속)</td><td class="num">${num(LT.ov / W)}</td><td></td></tr>
                  <tr><td class="lbl">법인시책 (2차년도)</td><td class="num">${num(LT.corp / W)}</td><td></td></tr>` : ''}
                ${(hasOwn || laterG > 0.00005) ? `<tr><td class="lbl"><b>세전 합계</b></td><td class="num"><b>${num(T_.pre)}</b></td><td></td></tr><tr><td class="lbl">세금 3.3%</td><td class="num">${T_.tax ? '−' + fmt(T_.tax) : '-'}</td><td></td></tr>` : ''}
                <tr><td class="lbl">쉐어 지급 (내 계약에서 넘긴 몫)</td><td class="num">${T_.out ? '−' + fmt(T_.out) : '-'}</td><td style="color:var(--text-mute);font-size:0.82rem;">계약진행사원 테이블로 계산한 세후의 지정 %</td></tr>
                <tr><td class="lbl">쉐어 수령 (남이 넘겨준 몫)</td><td class="num">${T_.inn ? '+' + fmt(T_.inn) : '-'}</td><td></td></tr>
                <tr class="total-row"><td>다음 달 실제 수령</td><td class="num">${fmt(T_.real)}</td><td></td></tr>
              </tbody></table>
            </div>
          </div>
          <div class="panel"><div class="panel-head"><h2>📆 월별 수령 예상 (모든 달 계약 합산)</h2><span style="color:var(--text-mute);font-size:0.82rem;">단위: 만원 · 앞으로 들어올 후속·2차년도 + 예전 계약분 포함</span></div><div class="panel-body" style="overflow-x:auto;max-height:560px;overflow-y:auto;">${HW.timelineHtml(TLALL, p.name, HW.monthKey())}<div class="tl-note">· 지급월은 <b>수수료 TYPE표 회차 기준 추정</b>입니다(회차 n = 계약월 + n개월, 익월 = 계약월 + 1). 손보 인보험·운전자·건강은 13·14·15회, IBK·카디프 적립·메트라이프는 13~36회 월분할, 미래에셋 연금은 13~24회 월분할, 카디프 일시납은 13회·25회, 그 밖의 상품은 13회 일괄(회차 미확인)로 넣었습니다. 상품별 방식은 수수료 계산기 「기준값 설정」에서 바꿀 수 있습니다.<br>· 후속 수수료는 요율표의 「후속」 값, 2차년도 시책은 「개인시책 2차년도」 · 법인시책 2차년도 값을 씁니다. 청약철회·해지·환수·메트라이프 RB(37회차)·GC는 반영하지 않았습니다.<br>· 쉐어는 건별로 지정한 %를 후속 지급에도 똑같이 적용합니다(세금 3.3% 뗀 금액 기준).</div></div></div>
          <div class="panel"><div class="panel-head"><h2>🔽 후속분만 따로 (작게)</h2><span style="color:var(--text-mute);font-size:0.82rem;">익월분은 빼고 앞으로 들어올 후속·2차년도만 · 단위: 만원</span></div><div class="panel-body" style="overflow-x:auto;max-height:380px;overflow-y:auto;">${HW.laterHtml(TLALL, p.name, HW.monthKey())}</div></div>
          ${own.some(o => o.x.out) ? `<div class="panel"><div class="panel-head"><h2>내 계약 중 쉐어로 넘긴 건</h2></div><div class="panel-body" style="overflow-x:auto;"><table class="tbl"><thead><tr><th>호</th><th>속성</th><th class="num">세후(쉐어 기준)</th><th>받는 사람</th><th class="num">넘긴 금액(원)</th></tr></thead><tbody>${own.filter(o => o.x.out).map(o => `<tr><td>${esc(o.c.ho == null ? '' : o.c.ho)}</td><td>${esc(o.c.tag || '')}</td><td class="num">${money(o.x.net)}</td><td>${o.x.lines.map(l => esc(l.name)).join(' · ')}</td><td class="num">${o.x.lines.map(l => money(l.amt)).join(' · ')}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
          ${got.length ? `<div class="panel"><div class="panel-head"><h2>쉐어로 받은 건</h2></div><div class="panel-body" style="overflow-x:auto;"><table class="tbl"><thead><tr><th>호</th><th>속성</th><th>계약진행사원</th><th class="num">받은 금액(원)</th></tr></thead><tbody>${got.map(o => `<tr><td>${esc(o.c.ho == null ? '' : o.c.ho)}</td><td>${esc(o.c.tag || '')}</td><td>${esc((r.ppl.find(q => q.id === o.c.emp) || {}).name || '')}</td><td class="num">${money(o.x.lines.filter(l => l.to === p.id).reduce((s_, l) => s_ + l.amt, 0))}</td></tr>`).join('')}</tbody></table></div></div>` : ''}`;
        return;
      }

      // 지사장 본인 명세만 총수수료(총수령+후속·2차년도)까지 표시, 나머지는 익월만
      const isBossStmt = p.role === 'boss';
      let rows, ikTotal, total;
      if (p.role === 'boss') {
        rows = [
          ['영업 수수료', p.ikSoo, p.huSoo],
          ['개인시책', p.siIk, p.si13],
          ['오버라이딩', r.bossOvIk, r.bossOvHu],
          [`법인시책 (${fmt(r.share)}%)`, r.corpIk, r.corp13],
        ];
        ikTotal = p.ikSoo + p.siIk + r.bossOvIk + r.corpIk;
        total = r.bossTotal;
      } else if (p.role === 'jijeom' || (p.ovIk || 0) > 0) {
        rows = [
          ['영업 수수료', p.ikSoo],
          ['개인시책', p.siIk],
          ['오버라이딩', p.ovIk || 0],
        ];
        ikTotal = p.ikSoo + p.siIk + (p.ovIk || 0);
      } else {
        rows = [
          ['영업 수수료', p.ikSoo],
          ['개인시책', p.siIk],
        ];
        ikTotal = p.ownIk;
      }
      const laterTotal = isBossStmt ? total - ikTotal : 0;
      const bodyRows = rows.map(([l,ik,la]) => isBossStmt
        ? `<tr><td class="lbl">${l}</td><td class="num">${fmt(ik)}</td><td class="num">${fmt(la)}</td></tr>`
        : `<tr><td class="lbl">${l}</td><td class="num">${fmt(ik)}</td></tr>`).join('');

      const noteTxt = p.role === 'jijeom' ? '팀장은 본인 영업분(있을 경우)과 오버라이딩을 수령합니다.'
        : (p.leader && p.part) ? '파트장은 본인 영업분과 파트원 계약에서 나오는 오버라이딩을 수령합니다.'
        : p.role === 'boss' ? `지사장 명세 = 본인 영업수수료 + 개인시책 + 오버라이딩 + 법인시책(${fmt(r.share)}%) 합산. (사원에게는 보이지 않습니다)`
        : '';

      const cardsHtml = isBossStmt
        ? `<div class="big2">
            <div class="bigcard ik"><div class="label">📅 익월 수령 (다음달 지급분)</div><div class="value">${fmt(ikTotal)} <small>만원</small></div></div>
            <div class="bigcard tot"><div class="label">총수령 (익월 + 후속·2차년도)</div><div class="value">${fmt(total)} <small>만원</small></div></div>
          </div>`
        : `<div class="big1">
            <div class="bigcard ik"><div class="label">📅 익월 수령 (다음달 지급분)</div><div class="value">${fmt(ikTotal)} <small>만원</small></div></div>
          </div>`;

      const theadHtml = isBossStmt
        ? `<thead><tr><th>항목</th><th class="num">익월</th><th class="num">후속·2차년도</th></tr></thead>`
        : `<thead><tr><th>항목</th><th class="num">익월</th></tr></thead>`;
      const totalRowHtml = isBossStmt
        ? `<tr class="total-row"><td>합계</td><td class="num">${fmt(ikTotal)}</td><td class="num">${fmt(laterTotal)}</td></tr>`
        : `<tr class="total-row"><td>합계</td><td class="num">${fmt(ikTotal)}</td></tr>`;

      document.getElementById('stmt').innerHTML = `
        <div class="stmt-head">
          <div class="avatar">${esc(p.name.charAt(0))}</div>
          <div><h2>${esc(p.name)}</h2><div class="role">${role} · ${mtxt} 월초성적 ${fmt(p.hwan)}만원</div></div>
        </div>

        ${cardsHtml}

        <div class="panel">
          <div class="panel-head"><h2>수령 내역</h2><span style="color:var(--text-mute);font-size:0.82rem;">단위: 만원</span></div>
          <div class="panel-body" style="overflow-x:auto;">
            <table class="tbl">
              ${theadHtml}
              <tbody>
                ${bodyRows}
                ${totalRowHtml}
              </tbody>
            </table>
            ${noteTxt ? `<div class="note2">${noteTxt}</div>` : ''}
          </div>
        </div>`;
    }
  </script>
