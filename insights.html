<!DOCTYPE html>
<html lang="ko">
<head>
<script src="organization-data.js"></script><script src="seed-data.js"></script><script src="preview-runtime.js"></script><link rel="stylesheet" href="preview.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인사이트 메모 · 지사 포털</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0 18px; }
    .toolbar .grow { flex:1; min-width:150px; }
    .inp { padding:10px 13px; border:1.5px solid var(--line-2); border-radius:10px; font-size:0.9rem; font-family:inherit; outline:none; background:#fff; }
    .inp:focus { border-color:var(--brand); }
    select.inp { cursor:pointer; }
    .mini { color:var(--text-mute); font-size:0.8rem; }
    .empty { color:var(--text-mute); font-size:0.9rem; padding:30px 4px; text-align:center; }

    .view-toggle { display:flex; border:1.5px solid var(--line-2); border-radius:10px; overflow:hidden; }
    .view-toggle button { border:none; background:#fff; padding:9px 14px; font-size:0.86rem; font-weight:700; cursor:pointer; color:var(--text-soft); font-family:inherit; }
    .view-toggle button.on { background:var(--brand); color:#fff; }

    /* 달력 */
    .cal-head { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px; }
    .cal-head h2 { font-size:1.05rem; font-weight:800; letter-spacing:-.3px; min-width:130px; text-align:center; }
    .cal-nav { border:1.5px solid var(--line-2); background:#fff; border-radius:9px; width:32px; height:32px; cursor:pointer; font-size:1rem; color:var(--text-soft); }
    .cal-nav:hover { border-color:var(--brand); color:var(--brand-dk); }
    .cal { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; }
    .cal .dow { text-align:center; font-size:0.76rem; font-weight:700; color:var(--text-mute); padding:4px 0; }
    .cal .day { border:1px solid var(--line); border-radius:11px; min-height:78px; padding:6px 7px; background:#fff; cursor:pointer; display:flex; flex-direction:column; gap:3px; overflow:hidden; }
    .cal .day:hover { border-color:var(--brand); }
    .cal .day.out { background:#fafbfc; color:var(--text-mute); }
    .cal .day.sel { border:2px solid var(--brand); box-shadow:0 0 0 3px var(--brand-sft); }
    .cal .day .num { font-size:0.78rem; font-weight:700; }
    .cal .day.today .num { color:#fff; background:var(--brand); border-radius:999px; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; }
    .cal .day .t-chip { font-size:0.7rem; font-weight:700; background:var(--brand-sft); color:var(--brand-dk); border-radius:6px; padding:1px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cal .day .more { font-size:0.68rem; color:var(--text-mute); }
    .day-sec { margin-top:20px; }
    .day-sec .day-title { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .day-sec .day-title h3 { font-size:0.98rem; font-weight:800; }

    /* 글 카드 */
    .feed { display:flex; flex-direction:column; gap:12px; }
    .post { position:relative; border:1px solid var(--line); border-radius:14px; padding:16px 18px; background:#fff; cursor:pointer; transition:box-shadow .15s; }
    .post:hover { box-shadow:0 6px 18px -8px rgba(16,24,40,.18); }
    .post h3 { font-size:0.98rem; font-weight:800; letter-spacing:-.3px; margin:0 0 6px; padding-right:40px; }
    .post .meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
    .post .body { font-size:0.9rem; color:var(--text-soft); white-space:pre-wrap; word-break:break-word; line-height:1.65; }
    .post .att { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .post .att img { max-height:200px; max-width:100%; border-radius:10px; border:1px solid var(--line); cursor:zoom-in; }
    .att-list { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
    .att-item { display:flex; align-items:center; gap:8px; font-size:0.84rem; color:var(--text-soft); background:#f7f8fa; border-radius:8px; padding:6px 10px; }
    .att-item button { border:none; background:none; cursor:pointer; color:var(--neg); font-weight:700; margin-left:auto; }
    .target-chip { font-size:0.76rem; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--brand-sft); color:var(--brand-dk); }
    .author-mini { font-size:0.78rem; color:var(--text-mute); }
    .star-btn { position:absolute; top:12px; right:14px; border:none; background:none; font-size:1.15rem; cursor:pointer; opacity:.35; padding:4px; line-height:1; }
    .star-btn.on { opacity:1; }
    .star-btn:hover { transform:scale(1.15); }

    /* 모달 */
    .modal-bg { display:none; position:fixed; inset:0; background:rgba(16,24,40,.45); z-index:80; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
    .modal-bg.open { display:flex; }
    .modal { background:#fff; border-radius:18px; box-shadow:0 24px 60px -12px rgba(16,24,40,.4); width:100%; max-width:640px; }
    .modal-head { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .modal-head h2 { font-size:1.1rem; font-weight:800; letter-spacing:-.4px; }
    .modal-x { background:none; border:none; font-size:1.4rem; line-height:1; cursor:pointer; color:var(--text-mute); padding:2px 6px; }
    .modal-x:hover { color:var(--text); }
    .modal-body { padding:20px 24px; }
    .modal-foot { padding:16px 24px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; align-items:center; }
    .fld { margin-bottom:14px; }
    .fld > label { display:block; font-size:0.82rem; font-weight:700; margin-bottom:6px; color:var(--text-soft); }
    .fld .inp, .fld textarea { width:100%; }
    .fld textarea { padding:11px 13px; border:1.5px solid var(--line-2); border-radius:10px; font-size:0.9rem; font-family:inherit; resize:vertical; min-height:170px; outline:none; line-height:1.6; }
    .fld textarea:focus { border-color:var(--brand); }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .checkline { display:flex; align-items:center; gap:9px; font-size:0.92rem; font-weight:600; cursor:pointer; padding:6px 0; }
    .checkline input { width:18px; height:18px; accent-color:var(--brand); }
    .danger { background:#fff; color:var(--neg); border:1px solid #f3c7c2; }
    .danger:hover { background:#fdecea; }
  </style>
<link rel="stylesheet" href="seoul-theme.css"></head>
<body>
  <div class="backdrop"></div>
  <aside class="sidebar" id="sidebar" data-active="insights"></aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
        <div><h1>인사이트 메모</h1><div class="sub">조직원 면담 기록과 인사이트를 서로 나누는 공간</div></div>
      </div>
      <button class="btn btn-brand" id="btnWrite">✏️ 기록 남기기</button>
    </header>

    <div class="content">
      <div class="panel">
        <div class="panel-body">
          <div class="toolbar">
            <input class="inp grow" id="q" placeholder="🔎 인원·내용·작성자 검색" />
            <select class="inp" id="fTarget"><option value="">면담 인원 전체</option></select>
            <div class="view-toggle">
              <button id="vCal" class="on">📅 달력</button>
              <button id="vList">📃 최신순</button>
              <button id="vBest">⭐ 베스트</button>
            </div>
            <span class="mini" id="count"></span>
          </div>

          <!-- 달력 보기 -->
          <div id="calWrap">
            <div class="cal-head">
              <button class="cal-nav" id="calPrev">‹</button>
              <h2 id="calTitle"></h2>
              <button class="cal-nav" id="calNext">›</button>
            </div>
            <div class="cal" id="cal"></div>
            <div class="day-sec" id="daySec"></div>
          </div>

          <!-- 목록/베스트 보기 -->
          <div class="feed" id="feed" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 글쓰기/수정 모달 -->
  <div class="modal-bg" id="editModal">
    <div class="modal">
      <div class="modal-head"><h2 id="editTitle">기록 남기기</h2><button class="modal-x" data-close>×</button></div>
      <div class="modal-body">
        <div class="row2">
          <div class="fld"><label>날짜</label><input class="inp" type="date" id="eDate"></div>
          <div class="fld"><label>작성자 <span class="mini">(내 이름)</span></label><input class="inp" id="eAuthor" list="authorList" placeholder="예: 김동휘"><datalist id="authorList"></datalist></div>
        </div>
        <div class="fld"><label>면담 인원 <span class="mini">(조직도에서 선택 · 일반 메모면 비워두세요)</span></label>
          <select class="inp" id="eTarget" style="width:100%"></select>
        </div>
        <div class="fld"><label>제목</label><input class="inp" id="eTitle2" placeholder="예: 히르찬님 세일즈 관리법"></div>
        <div class="fld"><label>내용</label><textarea id="eBody" placeholder="면담 내용, 얻은 인사이트, 세일즈 노하우 등을 자유롭게 남겨주세요."></textarea></div>
        <div class="fld"><label>사진 첨부 <span class="mini">(여러 장 가능)</span></label>
          <input class="inp" type="file" id="eFiles" accept="image/*" multiple>
          <div class="att-list" id="attList"></div>
        </div>
        <label class="checkline"><input type="checkbox" id="eStar"> ⭐ 베스트에 저장 (좋은 내용 모아보기)</label>
      </div>
      <div class="modal-foot">
        <button class="btn danger" id="btnDel" style="margin-right:auto;">🗑 삭제</button>
        <button class="btn btn-ghost" data-close>취소</button>
        <button class="btn btn-brand" id="btnSave">저장</button>
      </div>
    </div>
  </div>

  <script src="sidebar.js"></script>
  
  <script src="sb.js"></script>
  <script>
  (function () {
    const auth = JSON.parse(localStorage.getItem('hwAuth') || 'null');
    const canAccess = auth && (auth.role === 'boss' || auth.personId === 'team');
    if (!canAccess) { alert('접근 권한이 없습니다.'); location.href = 'index.html'; return; }

    const MOCK = Array.isArray(window.__MOCK_INSIGHTS);
    let posts = [];
    let orgPeople = [];            // [{group, name}]
    let view = 'cal';              // 'cal' | 'list' | 'best'
    let editId = null;
    let calY, calM;                // 표시 중인 연·월
    let selDate = todayStr();      // 달력에서 선택된 날짜

    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    { const t = new Date(); calY = t.getFullYear(); calM = t.getMonth(); }

    /* ---- 데이터 ---- */
    async function loadOrg() {
      const DEFAULT = { head: { name: '김병인', role: '지점장' }, cmo: { name: '한채혁(채미)', role: 'CMO' }, managers: [], influencers: [], coaches: [] };
      let org = DEFAULT;
      try {
        const { data } = await SB.from('app_config').select('value').eq('key', 'org').maybeSingle();
        if (data && data.value) org = Object.assign({}, DEFAULT, data.value);
      } catch (e) {}
      orgPeople = [];
      if (org.head && org.head.name) orgPeople.push({ group: org.head.role || '지점장', name: org.head.name });
      if (org.cmo && org.cmo.name) orgPeople.push({ group: org.cmo.role || 'CMO', name: org.cmo.name });
      (org.managers || []).forEach(n => orgPeople.push({ group: '매니저', name: n }));
      (org.influencers || []).forEach(n => orgPeople.push({ group: '인플루언서', name: n }));
      (org.coaches || []).forEach(n => orgPeople.push({ group: '세일즈코치', name: n }));
      fillTargetSelects();
    }
    function fillTargetSelects() {
      const groups = {};
      orgPeople.forEach(p => { (groups[p.group] = groups[p.group] || []).push(p.name); });
      const opts = Object.keys(groups).map(g => `<optgroup label="${esc(g)}">` + groups[g].map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('') + '</optgroup>').join('');
      $('eTarget').innerHTML = '<option value="">(선택 안 함 — 일반 메모)</option>' + opts;
      const cur = $('fTarget').value;
      $('fTarget').innerHTML = '<option value="">면담 인원 전체</option>' + opts;
      $('fTarget').value = cur;
    }
    async function loadPosts() {
      if (MOCK) { posts = window.__MOCK_INSIGHTS.slice(); render(); return; }
      const { data, error } = await SB.from('insights').select('*');
      if (error) { $('daySec').innerHTML = $('feed').innerHTML = `<div class="empty">⚠ 데이터를 못 불러왔어요. Supabase 표(insights)가 만들어졌는지 확인이 필요합니다.<br><span class="mini">${esc(error.message)}</span></div>`; return; }
      posts = data || [];
      render();
    }

    /* ---- 필터/정렬 ---- */
    function filtered(extra) {
      const q = $('q').value.trim().toLowerCase();
      const ft = $('fTarget').value;
      let list = posts.filter(p => {
        if (ft && (p.target || '') !== ft) return false;
        if (q) { const hay = `${p.title || ''} ${p.body || ''} ${p.target || ''} ${p.author || ''}`.toLowerCase(); if (!hay.includes(q)) return false; }
        if (extra && !extra(p)) return false;
        return true;
      });
      list.sort((a, b) => {
        const da = a.post_date || '', db = b.post_date || '';
        if (da !== db) return da < db ? 1 : -1;
        return (b.id || 0) - (a.id || 0);
      });
      return list;
    }

    /* ---- 카드 ---- */
    const isImg = name => /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(name || '');
    function attHtml(atts) {
      if (!atts || !atts.length) return '';
      return '<div class="att">' + atts.map(a => {
        const { data } = SB.storage.from('materials').getPublicUrl(a.path);
        const url = data.publicUrl;
        if (isImg(a.name)) return `<img src="${url}" alt="${esc(a.name)}" data-full="${url}">`;
        return `<a href="${url}" target="_blank" rel="noopener">📎 ${esc(a.name)}</a>`;
      }).join('') + '</div>';
    }
    function postCard(p) {
      return `<div class="post" data-id="${p.id}">
        <button class="star-btn${p.starred ? ' on' : ''}" data-star="${p.id}" title="베스트 저장">${p.starred ? '⭐' : '☆'}</button>
        <h3>${esc(p.title) || '<span class="mini">(제목 없음)</span>'}</h3>
        <div class="meta">${p.target ? `<span class="target-chip">👤 ${esc(p.target)}</span>` : ''}<span class="author-mini">${esc(p.author) || '?'} · ${esc(p.post_date || '')}</span></div>
        <div class="body">${esc(p.body)}</div>
        ${attHtml(p.attachments)}
      </div>`;
    }

    /* ---- 달력 ---- */
    function renderCal() {
      const list = filtered();
      const byDate = {};
      list.forEach(p => { const d = p.post_date || ''; if (d) (byDate[d] = byDate[d] || []).push(p); });

      $('calTitle').textContent = `${calY}년 ${calM + 1}월`;
      const first = new Date(calY, calM, 1);
      const start = new Date(first); start.setDate(1 - first.getDay());
      const cells = [];
      ['일', '월', '화', '수', '목', '금', '토'].forEach(d => cells.push(`<div class="dow">${d}</div>`));
      const tod = todayStr();
      for (let i = 0; i < 42; i++) {
        const d = new Date(start); d.setDate(start.getDate() + i);
        const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const out = d.getMonth() !== calM;
        const dayPosts = byDate[ds] || [];
        const chips = dayPosts.slice(0, 3).map(p => `<span class="t-chip">${esc(p.target || p.title || '메모')}</span>`).join('');
        const more = dayPosts.length > 3 ? `<span class="more">+${dayPosts.length - 3}</span>` : '';
        cells.push(`<div class="day${out ? ' out' : ''}${ds === tod ? ' today' : ''}${ds === selDate ? ' sel' : ''}" data-date="${ds}"><span class="num">${d.getDate()}</span>${chips}${more}</div>`);
      }
      $('cal').innerHTML = cells.join('');

      const dayPosts = (byDate[selDate] || []);
      $('daySec').innerHTML = `
        <div class="day-title">
          <h3>${selDate} 기록 <span class="mini">${dayPosts.length}개</span></h3>
          <button class="btn btn-ghost" id="btnWriteDay" style="padding:7px 13px; font-size:0.84rem;">＋ 이 날짜에 기록</button>
        </div>
        <div class="feed">${dayPosts.length ? dayPosts.map(postCard).join('') : '<div class="empty">이 날짜의 기록이 없어요.</div>'}</div>`;
    }

    /* ---- 목록/베스트 ---- */
    function renderFeed() {
      const list = view === 'best' ? filtered(p => p.starred) : filtered();
      $('count').textContent = list.length ? `${list.length}개` : '';
      $('feed').innerHTML = list.length ? list.map(postCard).join('')
        : `<div class="empty">${view === 'best' ? '⭐ 베스트로 저장된 글이 없어요. 글의 별표를 눌러 저장해보세요.' : (posts.length ? '조건에 맞는 글이 없어요.' : '아직 기록이 없어요. “✏️ 기록 남기기”로 시작해보세요.')}</div>`;
    }

    function render() {
      $('calWrap').style.display = view === 'cal' ? '' : 'none';
      $('feed').style.display = view === 'cal' ? 'none' : '';
      if (view === 'cal') { $('count').textContent = ''; renderCal(); } else renderFeed();
    }

    /* ---- 보기 전환/필터 ---- */
    function setView(v) {
      view = v;
      $('vCal').classList.toggle('on', v === 'cal');
      $('vList').classList.toggle('on', v === 'list');
      $('vBest').classList.toggle('on', v === 'best');
      render();
    }
    $('vCal').addEventListener('click', () => setView('cal'));
    $('vList').addEventListener('click', () => setView('list'));
    $('vBest').addEventListener('click', () => setView('best'));
    ['q', 'fTarget'].forEach(id => $(id).addEventListener('input', () => {
      if (view === 'cal' && $('q').value.trim()) setView('list'); else render();
    }));
    $('calPrev').addEventListener('click', () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); });
    $('calNext').addEventListener('click', () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); });
    $('cal').addEventListener('click', e => {
      const day = e.target.closest('.day');
      if (!day) return;
      selDate = day.dataset.date;
      renderCal();
    });

    /* ---- 글쓰기/수정 ---- */
    const modal = $('editModal');
    let editAtts = [];   // 수정 중인 글의 기존 첨부 (삭제 반영)
    function renderAttList() {
      const kept = editAtts.map((a, i) => `<div class="att-item">🖼 ${esc(a.name)}<button data-rmatt="${i}" title="첨부 빼기">✕</button></div>`).join('');
      const picked = [...($('eFiles').files || [])].map(f => `<div class="att-item">🆕 ${esc(f.name)}</div>`).join('');
      $('attList').innerHTML = kept + picked;
    }
    function openEdit(p, presetDate) {
      editId = p ? p.id : null;
      $('editTitle').textContent = p ? '기록 수정' : '기록 남기기';
      $('eDate').value = p ? (p.post_date || todayStr()) : (presetDate || todayStr());
      $('eAuthor').value = p ? (p.author || '') : (localStorage.getItem('hwInsightAuthor') || '');
      $('eTarget').value = p ? (p.target || '') : '';
      $('eTitle2').value = p ? (p.title || '') : '';
      $('eBody').value = p ? (p.body || '') : '';
      $('eStar').checked = p ? !!p.starred : false;
      $('eFiles').value = '';
      editAtts = p ? (p.attachments || []).slice() : [];
      renderAttList();
      $('btnDel').style.display = p ? '' : 'none';
      modal.classList.add('open');
    }
    $('eFiles').addEventListener('change', renderAttList);
    $('attList').addEventListener('click', e => {
      const b = e.target.closest('[data-rmatt]');
      if (!b) return;
      editAtts.splice(Number(b.dataset.rmatt), 1);
      renderAttList();
    });
    $('btnWrite').addEventListener('click', () => openEdit(null, view === 'cal' ? selDate : null));
    document.addEventListener('click', e => {
      if (e.target.id === 'btnWriteDay') { openEdit(null, selDate); return; }
      const img = e.target.closest('.post .att img');
      if (img) { window.open(img.dataset.full, '_blank'); return; }   // 사진 클릭 → 크게 보기
      const star = e.target.closest('.star-btn');
      if (star) { toggleStar(star.dataset.star); return; }
      const card = e.target.closest('.post');
      if (card) { const p = posts.find(x => String(x.id) === card.dataset.id); if (p) openEdit(p); }
    });

    async function toggleStar(id) {
      const p = posts.find(x => String(x.id) === String(id));
      if (!p) return;
      p.starred = !p.starred;
      render();
      if (!MOCK) {
        const { error } = await SB.from('insights').update({ starred: p.starred }).eq('id', p.id);
        if (error) { p.starred = !p.starred; render(); alert('저장 실패: ' + error.message); }
      }
    }

    $('btnSave').addEventListener('click', async () => {
      const rec = {
        post_date: $('eDate').value || todayStr(),
        author: $('eAuthor').value.trim(),
        target: $('eTarget').value || null,
        title: $('eTitle2').value.trim(),
        body: $('eBody').value.trim(),
        starred: $('eStar').checked,
      };
      if (!rec.author) { alert('작성자 이름을 적어주세요.'); return; }
      if (!rec.title && !rec.body) { alert('제목이나 내용을 적어주세요.'); return; }
      localStorage.setItem('hwInsightAuthor', rec.author);
      if (MOCK) { alert('미리보기 모드예요 — 실제 저장은 배포 후에 됩니다.'); modal.classList.remove('open'); return; }
      $('btnSave').disabled = true; $('btnSave').textContent = '저장 중…';
      try {
        // 사진 업로드 (경로는 영문/숫자만 — 한글 파일명은 name에만 보관)
        const atts = editAtts.slice();
        for (const file of $('eFiles').files) {
          const dot = file.name.lastIndexOf('.');
          const ext = (dot >= 0 ? file.name.slice(dot + 1) : '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase() || 'jpg';
          const path = `insights/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;
          const up = await SB.storage.from('materials').upload(path, file);
          if (up.error) { alert('사진 업로드 실패: ' + up.error.message); continue; }
          atts.push({ name: file.name, path });
        }
        rec.attachments = atts;
        const { error } = editId
          ? await SB.from('insights').update(rec).eq('id', editId)
          : await SB.from('insights').insert(rec);
        if (error) { alert('저장 실패: ' + error.message); return; }
        selDate = rec.post_date;
        modal.classList.remove('open'); await loadPosts();
      } finally {
        $('btnSave').disabled = false; $('btnSave').textContent = '저장';
      }
    });

    $('btnDel').addEventListener('click', async () => {
      if (!editId) return;
      if (!confirm('이 기록을 완전히 삭제할까요?')) return;
      if (MOCK) { alert('미리보기 모드예요.'); return; }
      const { error } = await SB.from('insights').delete().eq('id', editId);
      if (error) { alert('삭제 실패: ' + error.message); return; }
      modal.classList.remove('open'); await loadPosts();
    });

    modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-close]')) modal.classList.remove('open'); });

    loadOrg().then(loadPosts);
  })();
  </script>
