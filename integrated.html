.battle-actions{display:flex;gap:8px;flex-wrap:wrap}.battle-btn{border:1px solid #dfe6ed;border-radius:10px;background:#fff;padding:10px 12px;color:#273446;font-weight:800;font-size:12px;cursor:pointer}.battle-btn:hover{border-color:#f37321}.battle-btn.orange{background:#f37321;color:white;border-color:#f37321}.battle-btn.dark{background:#273446;color:#fff;border-color:#526172}.battle-btn.danger{color:#af2929}.battle-headactions .battle-btn{background:#ffffff10;color:#fff;border-color:#ffffff45}.battle-headactions .battle-btn.orange{background:#f37321;border-color:#f37321}

};
const $=q=>document.querySelector(q);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const counts=b=>b.leaders.reduce((n,l)=>n+1+l.members.length,0);
const total=()=>ORGANIZATION.reduce((n,b)=>n+counts(b),0);
let currentPage='dashboard',filter='all',query='';
function head(tag,title,desc,buttons=''){return `<section class="heading"><div><div class="eyebrow">${tag}</div><h2>${title}</h2><p>${desc}</p></div><div class="heading-actions">${buttons}</div></section>`}
function card(b){return `<article class="branch-card"><div class="branch-over"><span class="branch-dot"></span> BRANCH ${String(ORGANIZATION.indexOf(b)+1).padStart(2,'0')}</div><h4>${b.name}</h4><p>${b.desc}${b.id==='complex'?'<br>※ 소속 팀원 추후 반영':''}</p><div class="branch-count"><div><b>${counts(b)}</b><small>명 등록</small></div><button class="go" data-go-branch="${b.id}">조직도 보기 ↗</button></div></article>`}
function dashboard(){return head('BRANCH OPERATIONS','서울금융지사 통합 대시보드','4개 지점의 조직과 업무 현황을 한눈에 확인하세요.','<button class="btn primary" data-go="organization">전체 조직도 →</button>')+`<div class="kpi-grid"><div class="kpi"><div class="kpi-top">운영 지점 <span class="kpi-icon">▦</span></div><div class="kpi-num">4<span>지점</span></div><div class="kpi-caption">HFL · 복합 · 웨어인슈 · 부산</div></div><div class="kpi"><div class="kpi-top">등록 확인 인원 <span class="kpi-icon">♙</span></div><div class="kpi-num">${total()}<span>명</span></div><div class="kpi-caption">복합지점 미확인 인원 제외</div></div><div class="kpi"><div class="kpi-top">HFL 팀원 <span class="kpi-icon">◈</span></div><div class="kpi-num">8<span>명</span></div><div class="kpi-caption">함윤식 팀 5명 · 김성주 팀 3명</div></div><div class="kpi"><div class="kpi-top">실적 현황 <span class="kpi-icon">▤</span></div><div class="kpi-num">—</div><div class="kpi-caption">실제 데이터 연결 전</div></div></div><div class="section-head"><h3>지점별 조직 현황</h3><button data-go="organization">전체 조직도 보기 ↗</button></div><div class="branch-grid">${ORGANIZATION.map(card).join('')}</div><div class="panel-grid"><div class="panel"><h3>지사 공지 및 안내</h3><div class="notice"><span class="note-tag">데모</span><div><strong>서울금융지사 CRM 1차 미리보기</strong><p>조직도와 기본 메뉴를 확인하는 버전입니다. 실제 공지사항은 아직 연결되지 않았습니다.</p></div></div><div class="notice"><span class="note-tag">확인</span><div><strong>복합지점 조직원 명단 업데이트 예정</strong><p>김병인 지점장 아래의 조직도는 기존 사이트 자료를 확인한 뒤 반영합니다.</p></div></div></div><div class="panel"><h3>빠른 메뉴</h3><div class="quick-btns"><button class="quick-btn" data-go="organization">♙ &nbsp; 조직도 확인</button><button class="quick-btn" data-go="onboarding">◇ &nbsp; 교육 관리</button><button class="quick-btn" data-go="sales">▥ &nbsp; 실적 관리</button><button class="quick-btn" data-go="compliance">▣ &nbsp; 행정 · 심의</button></div></div></div><p class="tiny-footer">서울금융지사 CRM · 디자인 시안 v0.1 · 예시 데이터 사용</p>`}
function userButton(name,role,branch,leader,lead=false){const sig=[...name].slice(-2).join('');const data=[name,role,branch,leader].map(encodeURIComponent).join('|');return `<button class="person ${lead?'leader':'member'}" data-person="${data}" title="${name} 상세보기"><span class="person-avatar">${escapeHtml(sig)}</span><span class="person-text"><span class="person-name">${escapeHtml(name)}</span><span class="person-role">${escapeHtml(role)}</span></span><span class="person-arrow">›</span></button>`}
function orgBranch(b,term){let group=b.leaders.map(l=>{const leaderHit=(`${l.name} ${l.role} ${b.name}`).includes(term);const members=l.members.filter(m=>!term||leaderHit||m.includes(term));if(term&&!leaderHit&&members.length===0) return '';return `<div class="leader-block">${userButton(l.name,l.role,b.name,l.name,true)}${members.length?`<div class="teamlist"><div class="team-label">TEAM MEMBERS · ${members.length}명</div>${members.map(m=>userButton(m,'팀원',b.name,l.name)).join('')}</div>`:l.pending?'<div class="empty-team">기존 복합지점 CRM에 등록된 세부 조직원은 확인 후 추가됩니다.</div>':l.members.length===0?'<div class="empty-team">현재 1인 운영</div>':''}</div>`}).filter(Boolean).join('');if(!group)return '';return `<section class="org-branch"><div class="org-branch-head"><span class="branch-badge">${b.id==='hfl'?'HFL / TRAINING':b.id==='complex'?'COMPLEX FINANCE':b.id==='wear'?'GENERAL INSURANCE':'BUSAN'}</span><h4>${b.name}</h4><p>${b.desc} · 확인 인원 ${counts(b)}명</p></div><div class="org-nodes">${group}</div></section>`}
function organization(){const shown=ORGANIZATION.filter(b=>(filter==='all'||b.id===filter));const content=shown.map(b=>orgBranch(b,query.trim())).filter(Boolean).join('');return head('ORGANIZATION CHART','서울금융지사 조직도','지점별 조직을 펼쳐 보고, 이름으로 검색하거나 사람을 클릭해 소속 정보를 확인할 수 있습니다.')+`<div class="org-controls"><div class="filters">${[{id:'all',name:'전체' },...ORGANIZATION].map(b=>`<button class="filter ${filter===b.id?'active':''}" data-filter="${b.id}">${b.name}</button>`).join('')}</div><input class="search" id="search" placeholder="이름 또는 지점 검색" value="${escapeHtml(query)}" aria-label="조직원 검색"/></div><div class="org-root"><small>HANWHA LIFE FINANCIAL SERVICES</small><strong>서울금융지사</strong><span>총 4개 지점 운영</span></div><div class="org-grid" id="org-grid">${content||'<div class="empty-results">검색 결과가 없습니다. 다른 이름이나 지점을 검색해보세요.</div>'}</div><div class="org-foot">※ 현재 확인된 인원은 총 ${total()}명입니다. 복합지점은 김병인 지점장만 우선 등록했으며, 팀원과 팀 구성은 기존 CRM 조직도 확인 후 추가됩니다. 모든 수치는 실제 인사 시스템과 연결되지 않은 미리보기 기준입니다.</div><div class="org-legend">조직원 카드를 클릭하면 소속 지점과 직책을 볼 수 있습니다. 실제 서비스에서는 지점장별 수정 권한, 인사 발령 이력, 계정 등록 기능을 추가할 예정입니다.</div>`}
function placeholder(page){const [title,description,...features]=PLACEHOLDERS[page];return head('UPCOMING MODULE',title,'2차 작업에서 기능과 화면을 확장할 수 있도록 메뉴 자리를 마련했습니다.')+`<div class="placeholder"><div class="illustration">${page==='sales'?'▥':page==='onboarding'?'◇':page==='activity'?'☷':page==='calendar'?'▦':page==='compliance'?'▣':'⚙'}</div><h3>${title}</h3><p>${description}<br>이번 1차 버전에서는 임의의 데이터나 작동하지 않는 관리기능을 만들지 않았습니다.</p><div class="features">${features.map(f=>`<span class="feature">${f}</span>`).join('')}</div><p style="margin-top:27px"><button class="btn primary" data-go="organization">조직도 먼저 확인하기 →</button></p></div>`}

// 환산대결 데이터는 현재 브라우저에만 저장되며, 서버 동기화·실제 관리자 인증은 제공하지 않습니다.
let battleStorageWarning=false;
const BATTLE_KEY='seoul_crm_november_battle_2026_v1';
const BATTLE_MEMBERS={ysm:['양지후','정성연','김정우','신다찬','신지윤'],sj:['이지현','김범준','전사랑']};
const BATTLE_NEW=new Set(['김정우','신다찬','신지윤']);
const BATTLE_LABEL={ysm:'함윤식 지점',sj:'김성주 지점'};
const battleEmpty=()=>({version:1,period:'2026-11',scores:Object.fromEntries(Object.values(BATTLE_MEMBERS).flat().map(n=>[n,0])),updatedAt:null});
function battleLoad(){let b=battleEmpty();try{const r=JSON.parse(localStorage.getItem(BATTLE_KEY)||'null');if(r&&r.period==='2026-11'&&r.scores){Object.keys(b.scores).forEach(n=>b.scores[n]=Math.max(0,Number(r.scores[n])||0));b.updatedAt=r.updatedAt||null}}catch(e){}return b}
let battle=battleLoad(),battleEditing=false;
const won=n=>Math.round(Number(n)||0).toLocaleString('ko-KR');
const battleSum=k=>BATTLE_MEMBERS[k].reduce((a,n)=>a+(Number(battle.scores[n])||0),0);
const battleLeader=()=>battleSum('ysm')>battleSum('sj')?'ysm':battleSum('sj')>battleSum('ysm')?'sj':'tie';
function battlePerson(n){const v=Number(battle.scores[n]||0), rookie=BATTLE_NEW.has(n),name=(rookie?(v>0?'🐣 ':'🥚 '):'')+n;let tags='';if(v>=10000000) tags='<span class="battle-badge red">1000만 클럽 달성!</span>';else if(v>=2000000) tags='<span class="battle-badge">기본마감 완료!</span>';return `<div class="battle-row"><div class="battle-person"><span class="battle-name">${name}</span>${tags}</div><div>${battleEditing?`<label for="b-${encodeURIComponent(n)}">환산 실적 · 원</label><input id="b-${encodeURIComponent(n)}" data-score="${n}" type="number" min="0" step="1" inputmode="numeric" value="${v}" />`:`<div class="battle-amount">${won(v)} 원</div>`}</div></div>`}
function battleTeam(k){let a=battleSum(k),winning=battleLeader()===k;return `<article class="battle-team ${winning?'winning':''}"><div class="battle-kicker">${k==='ysm'?'TEAM 01 · HFL':'TEAM 02 · HFL'} ${winning?'<span class="battle-trophy">🏆 LEADING</span>':''}</div><h4>${BATTLE_LABEL[k]}</h4><div class="battle-sub">${BATTLE_MEMBERS[k].length}명 팀원 · 2026년 11월</div><div class="battle-total">${won(a)}<span class="battle-unit">원</span></div><div class="battle-sub">${a===0?'등록 실적 없음':'입력된 환산 실적 자동 합산'}</div></article>`}
function battlePage(){let a=battleSum('ysm'),b=battleSum('sj'),total=a+b,rate=total?Math.round(a/total*100):50,lead=battleLeader();return `
<section class="battle-hero"><div class="battle-overline">NOVEMBER TEAM BATTLE · 2026</div><h3>지점의 자존심을 건 승부!</h3><p>함윤식 지점 VS 김성주 지점 · 환산 업적 대결</p><div class="battle-headactions"><span style="font-size:12px;color:#fff9">${lead==='tie'?'현재 동점':BATTLE_LABEL[lead]+' 리드 중'} · ${battle.updatedAt?'마지막 저장 '+escapeHtml(new Date(battle.updatedAt).toLocaleString('ko-KR')):'실적 입력 전'}</span><div class="battle-actions"><button class="battle-btn ${battleEditing?'orange':''}" data-battle="edit">${battleEditing?'✓ 편집 종료':'✎ 이 브라우저에서 편집'}</button><button class="battle-btn" data-battle="export">↓ JSON 백업</button><button class="battle-btn" data-battle="import">↑ JSON 불러오기</button></div></div></section>
<div class="battle-topgrid">${battleTeam('ysm')}<div class="battle-vs">VS</div>${battleTeam('sj')}</div><div class="battle-progress"><div class="p-ysm" style="width:${rate}%"></div><div class="p-sj" style="width:${100-rate}%"></div></div><div class="battle-progresslegend"><span>🟠 함윤식 ${total?rate:'—'}${total?'%':''}</span><span>⚫ 김성주 ${total?100-rate:'—'}${total?'%':''}</span></div>
<div class="battle-panels"><section class="battle-panel"><h4>🟠 함윤식 지점 실적</h4><p>양지후 · 정성연 · 신입 3명</p>${BATTLE_MEMBERS.ysm.map(battlePerson).join('')}<div class="battle-summary">${a===0?'현재 등록된 환산 실적이 없습니다.':`총 환산 ${won(a)}원 · ${BATTLE_MEMBERS.ysm.filter(n=>battle.scores[n]>0).length}명 실적 등록`}</div></section><section class="battle-panel"><h4>⚫ 김성주 지점 실적</h4><p>이지현 · 김범준 · 전사랑</p>${BATTLE_MEMBERS.sj.map(battlePerson).join('')}<div class="battle-summary">${b===0?'현재 등록된 환산 실적이 없습니다.':`총 환산 ${won(b)}원 · ${BATTLE_MEMBERS.sj.filter(n=>battle.scores[n]>0).length}명 실적 등록`}</div></section></div>
<div class="battle-cue"><span style="font-size:24px">📣</span><div><strong>SCORE NEWS</strong><p>${total===0?'첫 계약의 주인공은 누구일까요? 오늘의 기록이 승부를 만듭니다.':lead==='tie'?'치열한 동점 승부! 다음 실적이 승부를 가릅니다.':BATTLE_LABEL[lead]+' 리드! 역전의 기회는 아직 남아 있습니다.'}</p></div></div>
<div class="battle-notice"><b>⚠️ 이 파일의 데이터 보관 방식</b><br>이 HTML은 개인용 오프라인 미리보기입니다. 입력값은 이 기기의 해당 브라우저(localStorage)에만 저장됩니다. 다른 직원과 실시간 동기화되지 않으며 관리자 인증·비공개 보호 기능이 없습니다. 고객정보나 민감한 업무정보를 입력하지 마세요. 브라우저 데이터가 삭제될 수 있으니 <b>JSON 백업</b>을 별도로 보관하세요.</div>
<div class="battle-footer"><div style="font-size:12px;color:#6b7989">* 신입 계약: 알 🥚 → 병아리 🐣 / 개인 200만원 이상: 기본마감 / 개인 1,000만원 이상: 1000만 클럽</div>${battleEditing?'<button class="battle-btn danger" data-battle="reset">실적 전체 초기화</button>':''}</div><input type="file" id="battle-file" accept="application/json,.json" style="display:none" />`}
function persistBattle(){battle.updatedAt=new Date().toISOString();try{localStorage.setItem(BATTLE_KEY,JSON.stringify(battle));return true}catch(e){if(!battleStorageWarning){alert('이 브라우저에서는 자동 저장이 제한됩니다. 입력값은 이 화면에서만 유지될 수 있으니 반드시 JSON 백업을 다운로드하세요.');battleStorageWarning=true;}return true}}
function celebrate(text){document.querySelector('.battle-confetti')?.remove();const box=document.createElement('div');box.className='battle-confetti';box.setAttribute('aria-hidden','true');const msg=document.createElement('div');msg.className='message';msg.innerHTML=escapeHtml(text)+'<span>11월 지점 환산대결 · ONE FOR ALL</span>';box.appendChild(msg);const colors=['#f37321','#ffb76e','#222f41','#ffffff','#f9d45b'];for(let i=0;i<90;i++){let el=document.createElement('i');el.style.left=(Math.random()*100)+'%';el.style.background=colors[i%colors.length];el.style.animationDelay=(Math.random()*.7)+'s';box.appendChild(el)}document.body.appendChild(box);setTimeout(()=>box.remove(),3800)}
function saveBattleScore(el){if(!battleEditing)return;const n=el.dataset.score;if(!(n in battle.scores))return;const before=battleLeader(),old=battle.scores[n],v=Number(el.value);if(!Number.isFinite(v)||v<0||v>999999999999){alert('0 이상의 유효한 금액을 입력하세요.');el.value=old;return}battle.scores[n]=Math.round(v);if(!persistBattle()){battle.scores[n]=old;return}const after=battleLeader(),firstWin=old===0&&v>0&&BATTLE_NEW.has(n);render();if(before!=='tie'&&after!=='tie'&&before!==after)celebrate('🎉 '+BATTLE_LABEL[after]+' 역전!');else if(old<10000000&&v>=10000000)celebrate('🎊 1000만 클럽 달성!');else if(firstWin)celebrate('🐣 '+n+' 첫 계약 축하!')}
function updateBattlePreview(el){} // 입력 확정(change) 시 저장하여 오입력을 방지합니다.
function downloadBattle(){const data={...battle,exportedAt:new Date().toISOString(),note:'서울금융지사 CRM 2026년 11월 지점 환산대결 오프라인 백업'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='서울금융지사_2026_11월_환산대결_백업.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBattleFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let r=JSON.parse(reader.result);if(r.period!=='2026-11'||!r.scores||typeof r.scores!=='object')throw Error('올바른 환산대결 백업 파일이 아닙니다.');for(const n of Object.keys(battle.scores)){const v=Number(r.scores[n]);if(!Number.isFinite(v)||v<0||v>999999999999)throw Error('실적 값이 올바르지 않습니다: '+n)}if(!confirm('현재 이 브라우저에 저장된 실적을 백업 내용으로 덮어쓸까요? 먼저 JSON 백업을 권장합니다.'))return;const next=battleEmpty();Object.keys(next.scores).forEach(n=>next.scores[n]=Math.round(Number(r.scores[n])));battle=next;persistBattle();render();alert('백업 데이터를 불러왔습니다.')}catch(e){alert('불러오기 실패: '+e.message)}};reader.readAsText(file,'utf-8')}
function handleBattleClick(e){const b=e.target.closest('[data-battle]');if(!b)return false;let a=b.dataset.battle;if(a==='edit'){battleEditing=!battleEditing;render()}if(a==='export')downloadBattle();if(a==='import')document.getElementById('battle-file')?.click();if(a==='reset'&&confirm('모든 환산 실적을 0원으로 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')){battle=battleEmpty();persistBattle();render()}return true}

function render(){document.querySelectorAll('[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===currentPage));$('#breadcrumb').textContent=PAGES[currentPage];$('#content').innerHTML=currentPage==='dashboard'?dashboard():currentPage==='organization'?organization():currentPage==='battle'?battlePage():placeholder(currentPage);}
function navigate(p){currentPage=p;filter='all';query='';$('#detail').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'});}
function drawOrgContent(){if(currentPage!=='organization')return;const panels=ORGANIZATION.filter(b=>filter==='all'||b.id===filter).map(b=>orgBranch(b,query.trim())).filter(Boolean).join('');$('#org-grid').innerHTML=panels||'<div class="empty-results">검색 결과가 없습니다.</div>';}
function showPerson(raw){const [name,role,branch,leader]=raw.split('|').map(decodeURIComponent);const isLead=(name===leader);const el=$('#detail');el.innerHTML=`<div class="detail-top"><span class="eyebrow">ORGANIZATION PROFILE</span><button class="close" id="close-detail" aria-label="닫기">×</button></div><h4>${escapeHtml(name)}</h4><p><strong>직책</strong> &nbsp; ${escapeHtml(role)}</p><p><strong>소속</strong> &nbsp; ${escapeHtml(branch)}</p>${!isLead?`<p><strong>팀장</strong> &nbsp; ${escapeHtml(leader)} 지점장</p>`:''}<hr><small>서울금융지사 · 조직도 미리보기</small><p class="disclaimer">본 화면에는 연락처, 고객정보, 인사평가 등 개인정보를 표시하지 않습니다.</p>`;el.classList.add('open');}
document.addEventListener('click',e=>{if(handleBattleClick(e))return;const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}const go=e.target.closest('[data-go]');if(go){navigate(go.dataset.go);return}const branch=e.target.closest('[data-go-branch]');if(branch){navigate('organization');filter=branch.dataset.goBranch;render();return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();const s=$('#search');if(s)s.focus();return}const person=e.target.closest('[data-person]');if(person){showPerson(person.dataset.person);return}if(e.target.closest('#close-detail')){$('#detail').classList.remove('open');return}});
document.addEventListener('input',e=>{if(e.target.matches('[data-score]')){updateBattlePreview(e.target);return;}if(e.target.id==='search'){query=e.target.value;drawOrgContent()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-score]')){saveBattleScore(e.target);return}if(e.target.id==='battle-file'){importBattleFile(e.target.files&&e.target.files[0]);e.target.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#detail').classList.remove('open')}});
render();
</script>
</body>
