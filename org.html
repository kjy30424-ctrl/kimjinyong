<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>조직도 · 서울금융지사</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="preview.css"><script src="organization-data.js"></script><script src="seed-data.js"></script><script src="preview-runtime.js"></script><link rel="stylesheet" href="seoul-theme.css"></head><body><aside class="sidebar" id="sidebar" data-active="org"></aside><main class="main"><header class="topbar"><div><h1>조직도</h1><p>서울금융지사 · 3개 지점 통합 조직도</p></div><button class="menu-toggle">☰</button></header><div class="content"><div id="tabs" class="branch-tabs"></div><input id="search" aria-label="조직원 검색" placeholder="이름·직책 검색"><div class="org-root">서울금융지사<small>ONE FOR ALL · 3개 지점</small></div><div id="chart" class="org-grid"></div></div></main><script src="sidebar.js"></script><script src="sb.js"></script><script>
let branches=SEOUL_BRANCHES,filter='전체';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.getElementById('tabs').innerHTML=['전체',...branches.map(b=>b.name)].map(n=>`<button data-branch="${esc(n)}" class="${filter===n?'active':''}">${esc(n)}</button>`).join('');const q=document.getElementById('search').value;document.getElementById('chart').innerHTML=branches.map((b,i)=>({b,i})).filter(({b})=>(filter==='전체'||filter===b.name)&&JSON.stringify(b).includes(q)).map(({b,i})=>`<section class="org-branch"><h2>${esc(b.name)}</h2><div class="org-lead">${esc(b.lead)}</div><p>${esc(b.desc)}</p>${b.teams.map((t,j)=>`<div class="org-team"><h3>${esc(t[0])}</h3><div class="chips">${t[1].map(n=>`<span>${esc(n)}</span>`).join('')}</div>${j===1?`<button class="add-person" data-bi="${i}" data-ti="${j}">＋ 조직원 추가</button>`:``}</div>`).join('')}</section>`).join('');document.querySelectorAll('[data-branch]').forEach(e=>e.onclick=()=>{filter=e.dataset.branch;render()});document.querySelectorAll('.add-person').forEach(e=>e.onclick=async()=>{const name=prompt('추가할 조직원 이름');if(!name?.trim())return;branches[e.dataset.bi].teams[e.dataset.ti][1].push(name.trim());await SB.from('app_config').upsert({key:'seoul_org_v2',value:branches});render()})}document.getElementById('search').oninput=render;(async()=>{const{data}=await SB.from('app_config').select().eq('key','seoul_org_v2').maybeSingle();if(data)branches=data.value;render()})();
</script><script src="task-core.js"></script><script src="backup-core.js"></script><script src="seoul-app.js"></script></body></html>
