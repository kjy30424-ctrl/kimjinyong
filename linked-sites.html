<!DOCTYPE html>
<html lang="ko">
<head>
<script src="organization-data.js"></script><script src="seed-data.js"></script><script src="preview-runtime.js"></script><link rel="stylesheet" href="preview.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연계 사이트 · 지사 포털</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .site-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
    .site-card { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow-sm); text-decoration:none; color:inherit; transition:border-color .15s, transform .1s; }
    .site-card:hover { border-color:var(--brand); transform:translateY(-1px); }
    .site-card .ico { width:42px; height:42px; flex:none; border-radius:11px; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--brand); }
    .site-card .meta { flex:1; min-width:0; }
    .site-card .meta .nm { font-weight:700; font-size:0.98rem; }
    .site-card .meta .ur { color:var(--text-mute); font-size:0.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .del-btn { background:none; border:none; cursor:pointer; font-size:0.95rem; opacity:0.5; }
    .del-btn:hover { opacity:1; }
    .empty { color:var(--text-mute); font-size:0.9rem; padding:20px 4px; }
  </style>
<link rel="stylesheet" href="seoul-theme.css"></head>
<body>
  <div class="backdrop"></div>
  <aside class="sidebar" id="sidebar" data-active="linked"></aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
        <div>
          <h1>연계 사이트</h1>
          <div class="sub">자주 쓰는 사이트를 모아둔 곳</div>
        </div>
      </div>
      <button class="btn btn-brand" id="addBtn" style="display:none">➕ 사이트 추가</button>
    </header>

    <div class="content">
      <div id="list"><div class="empty">불러오는 중…</div></div>
    </div>
  </div>

  <script src="sidebar.js"></script>
  
  <script src="sb.js"></script>
  <script>
    const auth = JSON.parse(localStorage.getItem('hwAuth') || 'null');
    const isBoss = auth && auth.role === 'boss';   // 추가·삭제는 지점장만, 열기는 누구나
    let sites = [];
    if (isBoss) document.getElementById('addBtn').style.display = '';

    const esc = s => String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const GLOBE = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>';

    async function load() {
      try {
        const { data } = await SB.from('app_config').select('value').eq('key', 'linked_sites').maybeSingle();
        sites = (data && data.value && Array.isArray(data.value.sites)) ? data.value.sites : [];
      } catch (e) { sites = []; }
      render();
    }

    async function save() {
      await SB.from('app_config').upsert({ key: 'linked_sites', value: { sites }, updated_at: new Date().toISOString() });
    }

    function render() {
      const box = document.getElementById('list');
      if (!sites.length) {
        box.innerHTML = `<div class="empty">등록된 사이트가 없습니다.${isBoss ? ' "➕ 사이트 추가"로 올려보세요.' : ''}</div>`;
        return;
      }
      box.innerHTML = '<div class="site-grid">' + sites.map(s => `
        <a class="site-card" href="${esc(s.url)}" target="_blank" rel="noopener">
          <span class="ico">${GLOBE}</span>
          <span class="meta"><div class="nm">${esc(s.label)}</div><div class="ur">${esc(s.url)}</div></span>
          ${isBoss ? `<button class="del-btn" data-del="${esc(s.id)}" title="삭제" onclick="event.preventDefault();">🗑</button>` : ''}
        </a>`).join('') + '</div>';
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      const label = prompt('사이트 이름 (예: 지사전용 투자사이트)');
      if (!label) return;
      let url = prompt('주소 (예: example.com)');
      if (!url) return;
      url = url.trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      sites.push({ id: 'l' + Date.now(), label: label.trim(), url });
      await save();
      render();
    });

    document.addEventListener('click', async e => {
      const b = e.target.closest('[data-del]');
      if (!b) return;
      e.preventDefault();
      if (!confirm('이 사이트를 삭제할까요?')) return;
      sites = sites.filter(s => s.id !== b.dataset.del);
      await save();
      render();
    });

    load();
  </script>
<script src="task-core.js"></script><script src="backup-core.js"></script><script src="seoul-app.js"></script></body>
</html>
