<!DOCTYPE html>
<html lang="ko">
<head>
<script src="organization-data.js"></script><script src="seed-data.js"></script><script src="preview-runtime.js"></script><link rel="stylesheet" href="preview.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고객 DB관리 · 지사 포털</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0 18px; }
    .toolbar .grow { flex:1; min-width:150px; }
    .inp { padding:10px 13px; border:1.5px solid var(--line-2); border-radius:10px; font-size:0.9rem; font-family:inherit; outline:none; background:#fff; }
    .inp:focus { border-color:var(--brand); }
    select.inp { cursor:pointer; }

    .chip { font-size:0.76rem; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; display:inline-block; }
    .chip.att  { background:var(--pos-sft); color:#15803d; }
    .chip.no   { background:#fdecea; color:#c0392b; }
    .chip.buj  { background:#fff3e6; color:#b35309; }
    .chip.dot  { background:#eef1f5; color:#8a929e; }
    .pill { font-size:0.76rem; font-weight:700; padding:3px 10px; border-radius:999px; display:inline-block; }
    .pill.yes { background:var(--pos-sft); color:#15803d; }
    .pill.no  { background:#eef1f5; color:#7a828f; }
    .lnk { color:var(--brand-dk); font-weight:700; cursor:pointer; border-bottom:1px dashed #f0c9a8; }
    .lnk:hover { background:var(--brand-sft); }

    .tbl td, .tbl th { padding:10px 11px; white-space:nowrap; }
    .tbl tbody tr { cursor:pointer; }
    .tbl td.center, .tbl th.center { text-align:center; }
    .mini { color:var(--text-mute); font-size:0.8rem; }
    .memo-cell { white-space:normal; max-width:180px; color:var(--text-soft); font-size:0.84rem; }
    .prod-cell { max-width:240px; overflow:hidden; text-overflow:ellipsis; font-size:0.84rem; }
    .empty { color:var(--text-mute); font-size:0.9rem; padding:30px 4px; text-align:center; }

    .modal-bg { display:none; position:fixed; inset:0; background:rgba(16,24,40,.45); z-index:80; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
    .modal-bg.open { display:flex; }
    .modal { background:#fff; border-radius:18px; box-shadow:0 24px 60px -12px rgba(16,24,40,.4); width:100%; max-width:640px; }
    .modal.lg { max-width:780px; }
    .modal-head { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .modal-head h2 { font-size:1.1rem; font-weight:800; letter-spacing:-.4px; }
    .modal-x { background:none; border:none; font-size:1.4rem; line-height:1; cursor:pointer; color:var(--text-mute); padding:2px 6px; }
    .modal-x:hover { color:var(--text); }
    .modal-body { padding:20px 24px; }
    .modal-foot { padding:16px 24px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; align-items:center; }
    .fld { margin-bottom:14px; }
    .fld > label { display:block; font-size:0.82rem; font-weight:700; margin-bottom:6px; color:var(--text-soft); }
    .fld .inp, .fld textarea { width:100%; }
    .fld textarea { padding:11px 13px; border:1.5px solid var(--line-2); border-radius:10px; font-size:0.9rem; font-family:inherit; resize:vertical; min-height:70px; outline:none; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .checkline { display:flex; align-items:center; gap:9px; font-size:0.92rem; font-weight:600; cursor:pointer; padding:6px 0; }
    .checkline input { width:18px; height:18px; accent-color:var(--brand); }

    .preview-box { border:1px solid var(--line); border-radius:12px; max-height:300px; overflow:auto; margin-top:6px; }
    .preview-box table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    .preview-box th { position:sticky; top:0; background:#f7f8fa; padding:8px 10px; text-align:left; color:var(--text-soft); font-size:0.74rem; font-weight:700; }
    .preview-box td { padding:7px 10px; border-top:1px solid var(--line); }
    .preview-box tr.skip td { background:#fdecea; color:#a33; text-decoration:line-through; }
    .preview-box tr.warn td { background:#fff8ec; color:#b35309; }
    .tag-new { color:var(--brand-dk); font-weight:700; }
    .tag-warn { color:#b35309; font-weight:700; }
    .danger { background:#fff; color:var(--neg); border:1px solid #f3c7c2; }
    .danger:hover { background:#fdecea; }
    .summary-note { font-size:0.82rem; color:var(--text-soft); margin:0 0 4px; }
  </style>
<link rel="stylesheet" href="seoul-theme.css"></head>
<body>
  <div class="backdrop"></div>
  <aside class="sidebar" id="sidebar" data-active="seminar"></aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
        <div><h1>고객 DB관리</h1><div class="sub">고객 명단 · 속성 · 참석 · 계약 통합 DB</div></div>

      <div class="panel">

            <select class="inp" id="fAttend"><option value="">참석 전체</option><option value="미정">미정</option><option value="참석">참석</option><option value="노쇼">노쇼</option><option value="부재">부재</option></select>

            <select class="inp" id="fSort"><option value="new">최신순</option><option value="name">이름순</option></select>
            <button class="btn btn-ghost" id="btnAddOne">＋ 한 명</button>

            <table class="tbl">

                <th class="center">번호</th><th>이름</th><th>연락처</th><th>DB생성날짜</th><th>속성</th><th class="center">참석여부</th>

        <div class="fld">

          <textarea id="pasteText" style="min-height:170px;" placeholder="예)&#10;홍길동	010-1234-5678	김병인	O&#10;김철수	010-2345-6789	김병인	&#10;이영희	010-3456-7890	최지우	O"></textarea>

  <script src="sidebar.js"></script>
  
  <script src="sb.js"></script>
  <script>
  (function () {
    const auth = JSON.parse(localStorage.getItem('hwAuth') || 'null');
    const ALLOWED_PERSONS = ['hcw', 'team'];
    const canAccess = auth && (auth.role === 'boss' || ALLOWED_PERSONS.includes(auth.personId));
    if (!canAccess) { alert('접근 권한이 없습니다.'); location.href = 'index.html'; return; }

    const SOURCE_SUGGEST = ['챌린지', '비대면세미나', '대면세미나', '소개', '타플랫폼', '지인', '기타'];
    const ATTENDS = ['미정', '참석', '노쇼', '부재'];

    let people = [];
    let parsed = null;
    let events = [];      // 행사 목록 (app_config 'seminar_events')
    let curEvent = '';    // 선택된 행사 — 참석여부는 이 행사 기준으로 표시·집계
    const att = p => (curEvent && p.attend) ? (p.attend[curEvent] || '') : '';

    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const digitsOnly = s => String(s == null ? '' : s).replace(/\D/g, '');
    function normPhone(s) { let d = digitsOnly(s); if (d.startsWith('82')) d = '0' + d.slice(2); return (d.length === 10 || d.length === 11) ? d : null; }
    function fmtPhone(s) { const d = digitsOnly(s); if (d.length === 11) return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7); if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6); return String(s || ''); }
    const isEmail = s => /@/.test(String(s || ''));
    const today = () => new Date().toISOString().slice(0, 10);
    function fillSelect(el, arr, cur) { el.innerHTML = arr.map(v => `<option value="${esc(v)}"${String(cur) === v ? ' selected' : ''}>${esc(v)}</option>`).join(''); }
    fillSelect($('eAttend'), ['-'].concat(ATTENDS));

    async function loadEvents() {
      if (window.__DEMO_EVENTS) { events = window.__DEMO_EVENTS.slice(); }
      else {
        try {
          const { data } = await SB.from('app_config').select('value').eq('key', 'seminar_events').maybeSingle();
          events = (data && data.value) || [];
        } catch (e) { events = []; }
      }
      if (!curEvent && events.length) curEvent = events[events.length - 1];
      fillEventSelect();
    }
    function fillEventSelect() {
      $('fEvent').innerHTML = events.map(ev => `<option value="${esc(ev)}"${ev === curEvent ? ' selected' : ''}>📌 ${esc(ev)}</option>`).join('') + `<option value=""${curEvent ? '' : ' selected'}>행사 선택 안 함</option>`;
    }
    async function saveEvents() {
      try { await SB.from('app_config').upsert({ key: 'seminar_events', value: events, updated_at: new Date().toISOString() }); } catch (e) {}
    }
    async function load() {
      const { data, error } = await SB.from('seminar_people').select('*');
      if (error) { $('rows').innerHTML = `<tr><td colspan="13" class="empty">⚠ 데이터를 못 불러왔어요. Supabase 표(seminar_people)와 새 칸(source·attend_status·db_date·coach 등)이 만들어졌는지 확인이 필요합니다.<br><span class="mini">${esc(error.message)}</span></td></tr>`; return; }
      people = data || [];
      if (typeof window.__DEMO_ATTEND === 'function') window.__DEMO_ATTEND(people);
      render();
    }

    function renderStats() {
      const c = f => people.filter(f).length;
      const cards = [
        { label: '총 인원', value: people.length, unit: '명' },
        { label: '계약자', value: c(p => p.contracted), unit: '명' },
        { label: '정상 계약', value: normalContracts().length, unit: '건' },
        { label: '장기보험료', value: normalContracts().reduce((s, x) => s + x.amt, 0), unit: '원' },
        { label: '행사 명단', value: curEvent ? c(p => !!att(p)) : '—', unit: '명' },
        { label: '참석', value: curEvent ? c(p => att(p) === '참석') : '—', unit: '명' },
        { label: '노쇼', value: curEvent ? c(p => att(p) === '노쇼') : '—', unit: '명' },
        { label: '미정', value: curEvent ? c(p => att(p) === '미정') : '—', unit: '명' },
      ];
      $('stats').innerHTML = cards.map(k => `<div class="stat"><div class="label">${k.label}</div><div class="value">${k.value.toLocaleString('ko-KR')}<small> ${k.unit}</small></div></div>`).join('');
    }

    function distinct(field) { return [...new Set(people.map(p => (p[field] || '').trim()).filter(Boolean))]; }
    // 계약상품 칸("상품A · 월 30만원 · 날짜 | 상품B · …")에서 상품명만 뽑기
    function productsOf(p) { return (p.contract_info || '').split(' | ').map(s => s.split(' · ')[0].trim()).filter(Boolean); }
    // 정상 계약 건 목록 (철회·해지 제외, 계약상품 칸의 건별) — 전산 "정상건수·장기보험료"와 같은 기준
    function normalContracts() {
      const out = [];
      for (const p of people) {
        if (!p.contracted || p.cancel_status) continue;
        for (const piece of (p.contract_info || '').split(' | ')) {
          if (!piece.trim()) continue;
          const m = piece.match(/월\s*([\d,]+)원/);
          out.push({ amt: m ? parseInt(m[1].replace(/,/g, ''), 10) : 0 });
        }
      }
      return out;
    }
    function setFilterOptions(el, label, values, withSuggest) {
      const cur = el.value;
      let arr = withSuggest ? [...new Set(SOURCE_SUGGEST.concat(values))] : values.slice().sort((a, b) => a.localeCompare(b, 'ko'));
      el.innerHTML = `<option value="">${label}</option>` + arr.map(v => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join('');
    }
    function refreshOptionLists() {
      const sources = [...new Set(SOURCE_SUGGEST.concat(distinct('source')))];
      setFilterOptions($('fSource'), '속성 전체', distinct('source'), true);
      $('sourceList').innerHTML = sources.map(v => `<option value="${esc(v)}">`).join('');
      setFilterOptions($('fRef'), '추천인 전체', distinct('referrer'), false);
      setFilterOptions($('fMgr'), '상담자 전체', distinct('manager'), false);
      setFilterOptions($('fCoach'), '계약인 전체', distinct('coach'), false);
      setFilterOptions($('fProduct'), '상품 전체', [...new Set(people.flatMap(productsOf))], false);
    }

    function filteredSorted() {
      const q = $('q').value.trim().toLowerCase(); const qd = digitsOnly(q);
      const fSource = $('fSource').value, fAttend = $('fAttend').value, fRef = $('fRef').value, fMgr = $('fMgr').value, fCoach = $('fCoach').value, fContract = $('fContract').value, fProduct = $('fProduct').value, fSort = $('fSort').value;
      let list = people.filter(p => {
        if (q) { const hn = (p.name || '').toLowerCase().includes(q); const hp = qd && digitsOnly(p.phone).includes(qd); const he = isEmail(p.phone) && String(p.phone).toLowerCase().includes(q); if (!hn && !hp && !he) return false; }
        if (fSource && (p.source || '') !== fSource) return false;
        if (fAttend && att(p) !== fAttend) return false;
        if (fRef && (p.referrer || '') !== fRef) return false;
        if (fMgr && (p.manager || '') !== fMgr) return false;
        if (fCoach && (p.coach || '') !== fCoach) return false;
        if (fContract === 'y' && !p.contracted) return false;
        if (fContract === 'n' && p.contracted) return false;
        if (fContract === 'cancel' && !p.cancel_status) return false;
        if (fProduct && !productsOf(p).includes(fProduct)) return false;
        if (curEvent && !att(p)) return false;   // 행사 선택 시: 그 행사 명단(도장 있는 사람)만
        return true;
      });
      list.sort((a, b) => {
        if (fSort === 'name') return (a.name || '').localeCompare(b.name || '', 'ko');
        const da = a.db_date || '', db = b.db_date || '';
        if (da !== db) return da < db ? 1 : -1;
        return (b.id || 0) - (a.id || 0);
      });
      return list;
    }

    function attendSummary(p) {
      const v = Object.values(p.attend || {});
      const a = v.filter(x => x === '참석').length, n = v.filter(x => x === '노쇼').length;
      if (!a && !n) return '<span class="mini">-</span>';
      const parts = [];
      if (a) parts.push(`<span class="chip att">참석${a}</span>`);
      if (n) parts.push(`<span class="chip no">노쇼${n}</span>`);
      return parts.join(' ');
    }
    function attendBadge(a) {
      if (a === '참석') return '<span class="chip att">참석</span>';
      if (a === '노쇼') return '<span class="chip no">노쇼</span>';
      if (a === '부재') return '<span class="chip buj">부재</span>';
      if (a === '미정') return '<span class="chip dot">미정</span>';
      return '<span class="mini">-</span>';
    }
    function sourceCell(p) { if (!p.source && !p.source_detail) return '<span class="mini">-</span>'; return esc(p.source || '') + (p.source_detail ? ` <span class="mini">(${esc(p.source_detail)})</span>` : ''); }
    function cancelBadge(c) { return (c === '철회' || c === '해지') ? `<span class="pill" style="background:#fdecea;color:#c0392b">${c}</span>` : '<span class="mini">-</span>'; }
    function lnk(val, attr) { return val ? `<span class="lnk" data-${attr}="${esc(val)}">${esc(val)}</span>` : '<span class="mini">-</span>'; }

    function render() {
      renderStats(); refreshOptionLists();
      const list = filteredSorted();
      const box = $('rows');
      if (!list.length) { box.innerHTML = `<tr><td colspan="13" class="empty">${people.length ? '조건에 맞는 사람이 없어요.' : '아직 등록된 명단이 없어요. “＋ 한 명” 또는 “📋 명단 붙여넣기”로 시작하세요.'}</td></tr>`; return; }
      box.innerHTML = list.map((p, i) => `
        <tr data-id="${p.id}">
          <td class="center mini">${i + 1}</td>
          <td class="name">${esc(p.name) || '<span class="mini">(이름없음)</span>'}</td>
          <td>${p.phone ? esc(fmtPhone(p.phone)) : '<span class="mini">-</span>'}</td>
          <td>${p.db_date ? esc(p.db_date) : '<span class="mini">-</span>'}</td>
          <td>${sourceCell(p)}</td>
          <td class="center">${curEvent ? attendBadge(att(p)) : attendSummary(p)}</td>
          <td class="center">${p.contracted ? '<span class="pill yes">계약</span>' : '<span class="pill no">-</span>'}</td>
          <td class="center">${cancelBadge(p.cancel_status)}</td>
          <td>${lnk(p.referrer, 'ref')}</td>
          <td>${lnk(p.manager, 'mgr')}</td>
          <td>${lnk(p.coach, 'coach')}</td>
          <td class="memo-cell">${esc(p.memo) || '<span class="mini">-</span>'}</td>
          <td class="prod-cell" title="${esc(p.contract_info)}">${esc(p.contract_info) || '<span class="mini">-</span>'}</td>
        </tr>`).join('');
    }

    ['q', 'fSource', 'fAttend', 'fRef', 'fMgr', 'fCoach', 'fContract', 'fProduct', 'fSort'].forEach(id => $(id).addEventListener('input', render));
    $('fEvent').addEventListener('change', () => { curEvent = $('fEvent').value; render(); });
    $('btnAddEvent').addEventListener('click', async () => {
      const name = prompt('새 행사 이름을 적어주세요 (예: 26년 7월 부의사다리 세미나)');
      if (!name || !name.trim()) return;
      if (events.includes(name.trim())) { alert('이미 있는 행사예요.'); return; }
      events.push(name.trim());
      curEvent = name.trim();
      await saveEvents();
      fillEventSelect(); render();
    });

    $('rows').addEventListener('click', e => {
      const m = e.target.closest('.lnk');
      if (m) {
        if (m.dataset.ref != null) $('fRef').value = m.dataset.ref;
        if (m.dataset.mgr != null) $('fMgr').value = m.dataset.mgr;
        if (m.dataset.coach != null) $('fCoach').value = m.dataset.coach;
        render(); return;
      }
      const tr = e.target.closest('tr[data-id]'); if (!tr) return;
      const p = people.find(x => String(x.id) === tr.dataset.id); if (p) openEdit(p);
    });

    /* 개인 추가/편집 */
    const editModal = $('editModal');
    let editId = null;
    function buildSourceSelect(cur) {
      const opts = [...new Set(SOURCE_SUGGEST.concat(distinct('source')))];
      const inList = opts.includes(cur);
      $('eSource').innerHTML = '<option value="">(선택 안 함)</option>' + opts.map(v => `<option value="${esc(v)}"${(inList && v === cur) ? ' selected' : ''}>${esc(v)}</option>`).join('') + '<option value="__custom">＋ 직접 입력…</option>';
      if (cur && !inList) { $('eSource').value = '__custom'; $('eSourceCustom').value = cur; $('eSourceCustom').style.display = ''; }
      else { $('eSourceCustom').value = ''; $('eSourceCustom').style.display = 'none'; }
    }
    $('eSource').addEventListener('change', function () { const c = this.value === '__custom'; $('eSourceCustom').style.display = c ? '' : 'none'; if (c) $('eSourceCustom').focus(); });
    function openEdit(p) {
      editId = p ? p.id : null;
      $('editTitle').textContent = p ? (esc(p.name) + ' 정보') : '새 고객 추가';
      $('eDate').value = p ? (p.db_date || '') : today();
      $('eAttendLabel').textContent = curEvent ? `참석여부 — ${curEvent}` : '참석여부 (상단에서 행사를 먼저 선택)';
      $('eAttend').disabled = !curEvent;
      fillSelect($('eAttend'), ['-'].concat(ATTENDS), p ? (att(p) || '-') : '-');
      const hist = p && p.attend ? Object.entries(p.attend) : [];
      $('attHist').innerHTML = hist.length ? '<span class="mini">참석 이력: ' + hist.map(([ev, st]) => `${esc(ev)} <b>${esc(st)}</b>`).join(' · ') + '</span>' : '';
      buildSourceSelect(p ? (p.source || '') : '');
      $('eDetail').value = p ? (p.source_detail || '') : '';
      $('eCancel').value = p ? (p.cancel_status || '') : '';
      $('eName').value = p ? (p.name || '') : '';
      $('ePhone').value = p ? (p.phone ? (isEmail(p.phone) ? p.phone : fmtPhone(p.phone)) : '') : '';
      $('eContract').checked = p ? !!p.contracted : false;
      $('eProduct').value = p ? (p.contract_info || '') : '';
      $('eRef').value = p ? (p.referrer || '') : '';
      $('eMgr').value = p ? (p.manager || '') : '';
      $('eCoach').value = p ? (p.coach || '') : '';
      $('eMemo').value = p ? (p.memo || '') : '';
      $('btnDelPerson').style.display = p ? '' : 'none';
      editModal.classList.add('open');
    }
    $('btnAddOne').addEventListener('click', () => openEdit(null));

    function recFromEdit() {
      const raw = $('ePhone').value.trim();
      let phone = null; if (raw) phone = isEmail(raw) ? raw : (normPhone(raw) || raw);
      const cur = editId ? (people.find(x => x.id === editId) || {}) : {};
      const attendObj = Object.assign({}, cur.attend || {});
      if (curEvent) {
        const v = $('eAttend').value;
        if (v === '-') delete attendObj[curEvent]; else attendObj[curEvent] = v;
      }
      return {
        name: $('eName').value.trim(),
        phone,
        source: ($('eSource').value === '__custom' ? $('eSourceCustom').value.trim() : $('eSource').value) || null,
        source_detail: $('eDetail').value.trim() || null,
        attend: attendObj,
        contracted: $('eContract').checked,
        cancel_status: $('eCancel').value || null,
        contract_info: $('eProduct').value.trim() || null,
        referrer: $('eRef').value.trim() || null,
        manager: $('eMgr').value.trim() || null,
        coach: $('eCoach').value.trim() || null,
        db_date: $('eDate').value || null,
        memo: $('eMemo').value.trim() || null,
      };
    }
    $('btnSavePerson').addEventListener('click', async () => {
      const rec = recFromEdit();
      if (!rec.name) { alert('이름을 입력하세요.'); return; }
      $('btnSavePerson').disabled = true; $('btnSavePerson').textContent = '저장 중…';
      const { error } = editId
        ? await SB.from('seminar_people').update(rec).eq('id', editId)
        : await SB.from('seminar_people').insert(rec);
      $('btnSavePerson').disabled = false; $('btnSavePerson').textContent = '저장';
      if (error) { alert('저장 실패: ' + error.message); return; }
      editModal.classList.remove('open'); await load();
    });
    $('btnDelPerson').addEventListener('click', async () => {
      if (!editId) return;
      if (!confirm('이 사람을 완전히 삭제할까요?')) return;
      const { error } = await SB.from('seminar_people').delete().eq('id', editId);
      if (error) { alert('삭제 실패: ' + error.message); return; }
      editModal.classList.remove('open'); await load();
    });

    /* 붙여넣기: 이름[탭]전화[탭]추천인[탭]참석(O) */
    const pasteModal = $('pasteModal');
    $('btnPaste').addEventListener('click', () => {
      $('pasteText').value = ''; $('pDate').value = today();
      $('previewWrap').style.display = 'none'; $('btnCommit').style.display = 'none'; $('pasteHint').textContent = '';
      $('pasteEventNote').innerHTML = curEvent
        ? `📌 이 명단은 <b>"${esc(curEvent)}"</b> 행사 명단으로 들어갑니다. 이미 등록된 고객이면 이 행사 도장만 추가돼요. (참석 O 없으면 '미정')`
        : '⚠ 행사를 선택하지 않은 상태라, 참석 도장 없이 사람만 추가됩니다. 행사 명단으로 넣으려면 창을 닫고 상단에서 행사를 먼저 선택하세요.';
      parsed = null; pasteModal.classList.add('open');
    });

    function parsePaste(line) {
      let name = '', contactRaw = '', referrer = '', attendRaw = '';
      if (line.includes('\t')) {
        const c = line.split('\t').map(s => s.trim());
        name = c[0] || ''; contactRaw = c[1] || ''; referrer = c[2] || ''; attendRaw = c[3] || '';
      } else {
        const parts = line.split(/,|\s{2,}|\s+/).map(s => s.trim()).filter(Boolean);
        name = parts.find(p => /^[가-힣]{2,6}$/.test(p)) || parts[0] || '';
        contactRaw = parts.find(p => normPhone(p)) || parts.find(p => isEmail(p)) || '';
      }
      // 연락처 판정
      let phone = null, warn = false;
      if (contactRaw) {
        if (normPhone(contactRaw)) phone = normPhone(contactRaw);
        else if (isEmail(contactRaw)) phone = contactRaw;
        else { phone = contactRaw; warn = true; }   // 전화도 이메일도 아님 → 확인 필요
      }
      if (referrer === '없음' || referrer === '-') referrer = '';
      const attend = attendRaw ? '참석' : null;
      if (!name) warn = true;
      return { name, phone, referrer, attend, warn, raw: line };
    }

    $('btnPreview').addEventListener('click', () => {
      const lines = $('pasteText').value.split('\n').map(l => l.replace(/\s+$/, '')).filter(l => l.trim());
      if (!lines.length) { alert('붙여넣은 명단이 없어요.'); return; }
      const seen = new Set();
      const rows = lines.map(line => {
        const r = parsePaste(line); let status = r.warn ? 'warn' : 'ok', reason = '';
        if (!r.name && !r.phone) { status = 'skip'; reason = '이름·연락처 인식 불가'; }
        else if (!r.name) { reason = '이름 없음'; }
        else if (r.warn) { reason = '연락처 확인'; }
        if (r.phone && normPhone(r.phone)) { const d = normPhone(r.phone); if (seen.has(d)) { status = 'skip'; reason = '같은 명단 내 중복'; } seen.add(d);
          const exist = status !== 'skip' ? people.find(p => normPhone(p.phone) === d) : null;
          if (exist) {
            if (!curEvent) { status = 'skip'; reason = '이미 등록됨'; }
            else if (exist.attend && exist.attend[curEvent]) { status = 'skip'; reason = `이미 이 행사 명단에 있음(${exist.attend[curEvent]})`; }
            else { status = 'exist'; r.existId = exist.id; }
          } }
        return { ...r, status, reason };
      });
      const ok = rows.filter(r => r.status !== 'skip');
      const warnN = ok.filter(r => r.status === 'warn').length;
      parsed = rows;
      $('previewRows').innerHTML = rows.map(r => `<tr class="${r.status === 'skip' ? 'skip' : r.status === 'warn' ? 'warn' : ''}">
        <td>${esc(r.name) || '<i>?</i>'}</td>
        <td>${r.phone ? (normPhone(r.phone) ? esc(fmtPhone(r.phone)) : esc(r.phone)) : '<span class="mini">없음</span>'}</td>
        <td>${esc(r.referrer) || '<span class="mini">-</span>'}</td>
        <td>${r.attend === '참석' ? '<span class="chip att">참석</span>' : (curEvent ? '<span class="chip dot">미정</span>' : '<span class="mini">-</span>')}</td>
        <td>${r.status === 'skip' ? ('건너뜀: ' + r.reason) : r.status === 'warn' ? `<span class="tag-warn">확인 필요: ${r.reason}</span>` : r.status === 'exist' ? '<span class="tag-new">기존 → 행사 명단 추가</span>' : '<span class="tag-new">신규</span>'}</td></tr>`).join('');
      const newRefs = [...new Set(ok.filter(r => !r.existId).map(r => r.referrer).filter(Boolean).filter(x => !distinct('referrer').includes(x)))];
      const skip = rows.length - ok.length;
      const existN = ok.filter(r => r.existId).length;
      $('previewSummary').innerHTML = `총 ${rows.length}줄 → <b>신규 ${ok.length - existN}명</b>` + (existN ? ` · <b>기존 고객 행사 명단 추가 ${existN}명</b>` : '') + (warnN ? ` (확인 필요 ${warnN})` : '') + (skip ? ` · <span style="color:#c0392b">건너뜀 ${skip}</span>` : '') + (newRefs.length ? `<br>새 추천인: <b>${newRefs.map(esc).join(', ')}</b> — 맞는지 확인해주세요.` : '');
      $('previewWrap').style.display = ''; $('btnCommit').style.display = ok.length ? '' : 'none';
      $('pasteHint').textContent = warnN ? '“확인 필요”가 있어요. 이대로 저장하거나, 명단을 고쳐 다시 미리보기 하세요.' : (ok.length ? '“확정 저장”을 누르세요.' : '저장할 항목이 없어요.');
    });

    $('btnCommit').addEventListener('click', async () => {
      if (!parsed) return;
      const ok = parsed.filter(r => r.status !== 'skip');
      if (!ok.length) return;
      const d = $('pDate').value || null;
      const stamp = r => curEvent ? { [curEvent]: r.attend === '참석' ? '참석' : '미정' } : {};
      const newOnes = ok.filter(r => !r.existId);
      const existOnes = ok.filter(r => r.existId);
      $('btnCommit').disabled = true; $('btnCommit').textContent = '저장 중…';
      try {
        if (newOnes.length) {
          const records = newOnes.map(r => ({ name: r.name || '(이름없음)', phone: r.phone || null, referrer: r.referrer || null, attend: stamp(r), db_date: d }));
          const { error } = await SB.from('seminar_people').insert(records);
          if (error) { alert('저장 실패: ' + error.message); return; }
        }
        for (const r of existOnes) {
          const p = people.find(x => x.id === r.existId);
          const merged = Object.assign({}, (p && p.attend) || {}, stamp(r));
          const { error } = await SB.from('seminar_people').update({ attend: merged }).eq('id', r.existId);
          if (error) { alert(`저장 실패(${r.name}): ` + error.message); return; }
        }
        pasteModal.classList.remove('open'); await load();
        alert(`완료! 신규 ${newOnes.length}명 추가` + (existOnes.length ? `, 기존 고객 ${existOnes.length}명 행사 명단에 추가` : '') + '됐어요.');
      } finally {
        $('btnCommit').disabled = false; $('btnCommit').textContent = '✔ 확정 저장';
      }
    });

    /* CSV */
    $('btnExport').addEventListener('click', () => {
      const head = ['번호', '이름', '연락처', 'DB생성날짜', '속성', '세부', `참석여부(${curEvent || '행사없음'})`, '계약여부', '철회/해지', '추천인', '상담자', '계약인', '메모', '계약상품'];
      const escCsv = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const list = filteredSorted();
      const lines = [head.map(escCsv).join(',')];
      list.forEach((p, i) => lines.push([i + 1, p.name || '', p.phone ? (normPhone(p.phone) ? fmtPhone(p.phone) : p.phone) : '', p.db_date || '', p.source || '', p.source_detail || '', att(p), p.contracted ? 'O' : '', p.cancel_status || '', p.referrer || '', p.manager || '', p.coach || '', p.memo || '', p.contract_info || ''].map(escCsv).join(',')));
      const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '고객DB_' + today() + '.csv'; a.click(); URL.revokeObjectURL(a.href);
    });

    document.querySelectorAll('.modal-bg').forEach(bg => bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) bg.classList.remove('open'); }));
    loadEvents().then(load);
  })();
  </script>
<script src="task-core.js"></script><script src="backup-core.js"></script><script src="seoul-app.js"></script></body>
</html>
