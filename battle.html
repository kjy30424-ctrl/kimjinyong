let battleStorageWarning=false;
const BATTLE_KEY='seoul_crm_november_battle_2026_v1';
const BATTLE_MEMBERS={ysm:['양지후','정성연','김정우','신다찬','신지윤'],sj:['이지현','김범준','전사랑']};
const BATTLE_NEW=new Set(['김정우','신다찬','신지윤']);
const BATTLE_LABEL={ysm:'함윤식 지점',sj:'김성주 지점'};
const battleEmpty=()=>({version:1,period:'2026-11',scores:Object.fromEntries(Object.values(BATTLE_MEMBERS).flat().map(n=>[n,0])),updatedAt:null});
function battleLoad(){let b=battleEmpty();try{const r=JSON.parse(localStorage.getItem(BATTLE_KEY)||'null');if(r&&r.period==='2026-11'&&r.scores){Object.keys(b.scores).forEach(n=>b.scores[n]=Number.isFinite(Number(r.scores[n]))?Math.min(999999999999,Math.max(0,Math.round(Number(r.scores[n])))):0);b.updatedAt=r.updatedAt||null}}catch(e){}return b}
let battle=battleLoad(),battleEditing=false;
const won=n=>Math.round(Number(n)||0).toLocaleString('ko-KR');
const battleSum=k=>BATTLE_MEMBERS[k].reduce((a,n)=>a+(Number(battle.scores[n])||0),0);
const battleLeader=()=>battleSum('ysm')>battleSum('sj')?'ysm':battleSum('sj')>battleSum('ysm')?'sj':'tie';
function battlePerson(n){const v=Number(battle.scores[n]||0), rookie=BATTLE_NEW.has(n),name=(rookie?(v>0?'🐣 ':'🥚 '):'')+n;let tags='';if(v>=10000000) tags='<span class="battle-badge red">1000만 클럽 달성!</span>';else if(v>=2000000) tags='<span class="battle-badge">기본마감 완료!</span>';return `<div class="battle-row"><div class="battle-person"><span class="battle-name">${name}</span>${tags}</div><div>${battleEditing?`<label for="b-${encodeURIComponent(n)}">환산 실적 · 원</label><input id="b-${encodeURIComponent(n)}" data-score="${n}" type="number" min="0" step="1" inputmode="numeric" value="${v}" />`:`<div class="battle-amount">${won(v)} 원</div>`}</div></div>`}
function battleTeam(k){let a=battleSum(k),winning=battleLeader()===k;return `<article class="battle-team ${winning?'winning':''}"><div class="battle-kicker">${k==='ysm'?'TEAM 01 · HFL':'TEAM 02 · HFL'} ${winning?'<span class="battle-trophy">🏆 LEADING</span>':''}</div><h4>${BATTLE_LABEL[k]}</h4><div class="battle-sub">${BATTLE_MEMBERS[k].length}명 팀원 · 2026년 11월</div><div class="battle-total">${won(a)}<span class="battle-unit">원</span></div><div class="battle-sub">${a===0?'등록 실적 없음':'입력된 환산 실적 자동 합산'}</div></article>`}
function battlePage(){let a=battleSum('ysm'),b=battleSum('sj'),total=a+b,rate=total?Math.round(a/total*100):50,lead=battleLeader();return `
<section class="battle-hero"><div class="battle-overline">NOVEMBER TEAM BATTLE · 2026</div><h3>지점의 자존심을 건 승부!</h3><p>함윤식 지점 VS 김성주 지점 · 환산 업적 대결</p><div class="battle-headactions"><span style="font-size:12px;color:#fff9">${lead==='tie'?'현재 동점':BATTLE_LABEL[lead]+' 리드 중'} · ${battle.updatedAt?'마지막 저장 '+escapeHtml(new Date(battle.updatedAt).toLocaleString('ko-KR')):'실적 입력 전'}</span><div class="battle-actions"><button class="battle-btn ${battleEditing?'orange':''}" data-battle="edit">${battleEditing?'✓ 편집 종료':'✎ 이 브라우저에서 편집'}</button><button class="battle-btn" data-battle="export">↓ JSON 백업</button><button class="battle-btn" data-battle="import">↑ JSON 불러오기</button></div></div></section>
<div class="battle-topgrid">${battleTeam('ysm')}<div class="battle-vs">VS</div>${battleTeam('sj')}</div><div class="battle-progress"><div class="p-ysm" style="width:${rate}%"></div><div class="p-sj" style="width:${100-rate}%"></div></div><div class="battle-progresslegend"><span>🟠 함윤식 ${total?rate:'—'}${total?'%':''}</span><span>⚫ 김성주 ${total?100-rate:'—'}${total?'%':''}</span></div>
<div class="battle-panels"><section class="battle-panel"><h4>🟠 함윤식 지점 실적</h4><p>양지후 · 정성연 · 신입 3명</p>${BATTLE_MEMBERS.ysm.map(battlePerson).join('')}<div class="battle-summary">${a===0?'현재 등록된 환산 실적이 없습니다.':`총 환산 ${won(a)}원 · ${BATTLE_MEMBERS.ysm.filter(n=>battle.scores[n]>0).length}명 실적 등록`}</div></section><section class="battle-panel"><h4>⚫ 김성주 지점 실적</h4><p>이지현 · 김범준 · 전사랑</p>${BATTLE_MEMBERS.sj.map(battlePerson).join('')}<div class="battle-summary">${b===0?'현재 등록된 환산 실적이 없습니다.':`총 환산 ${won(b)}원 · ${BATTLE_MEMBERS.sj.filter(n=>battle.scores[n]>0).length}명 실적 등록`}</div></section></div>
<div class="battle-cue"><span style="font-size:24px">📣</span><div><strong>SCORE NEWS</strong><p>${total===0?'첫 계약의 주인공은 누구일까요? 오늘의 기록이 승부를 만듭니다.':lead==='tie'?'치열한 동점 승부! 다음 실적이 승부를 가릅니다.':BATTLE_LABEL[lead]+' 리드! 역전의 기회는 아직 남아 있습니다.'}</p></div></div>
<div class="battle-notice"><b>⚠️ 이 파일의 데이터 보관 방식</b><br>이 페이지의 실적은 브라우저별로 보관됩니다. 입력값은 이 기기의 해당 브라우저(localStorage)에만 저장됩니다. 다른 직원과 실시간 동기화되지 않으며 관리자 인증·비공개 보호 기능이 없습니다. 고객정보나 민감한 업무정보를 입력하지 마세요. 브라우저 데이터가 삭제될 수 있으니 <b>JSON 백업</b>을 별도로 보관하세요.</div>
<div class="battle-footer"><div style="font-size:12px;color:#6b7989">* 신입 계약: 알 🥚 → 병아리 🐣 / 개인 200만원 이상: 기본마감 / 개인 1,000만원 이상: 1000만 클럽</div>${battleEditing?'<button class="battle-btn danger" data-battle="reset">실적 전체 초기화</button>':''}</div><input type="file" id="battle-file" accept="application/json,.json" style="display:none" />`}
function persistBattle(){battle.updatedAt=new Date().toISOString();try{localStorage.setItem(BATTLE_KEY,JSON.stringify(battle));return true}catch(e){if(!battleStorageWarning){alert('이 브라우저에서는 자동 저장이 제한됩니다. 입력값은 이 화면에서만 유지될 수 있으니 반드시 JSON 백업을 다운로드하세요.');battleStorageWarning=true;}return true}}
function celebrate(text){document.querySelector('.battle-confetti')?.remove();const box=document.createElement('div');box.className='battle-confetti';box.setAttribute('aria-hidden','true');const msg=document.createElement('div');msg.className='message';msg.innerHTML=escapeHtml(text)+'<span>11월 지점 환산대결 · ONE FOR ALL</span>';box.appendChild(msg);const colors=['#f37321','#ffb76e','#222f41','#ffffff','#f9d45b'];for(let i=0;i<90;i++){let el=document.createElement('i');el.style.left=(Math.random()*100)+'%';el.style.background=colors[i%colors.length];el.style.animationDelay=(Math.random()*.7)+'s';box.appendChild(el)}document.body.appendChild(box);setTimeout(()=>box.remove(),3800)}
function saveBattleScore(el){if(!battleEditing)return;const n=el.dataset.score;if(!(n in battle.scores))return;const before=battleLeader(),old=battle.scores[n],v=Number(el.value);if(!Number.isFinite(v)||v<0||v>999999999999){alert('0 이상의 유효한 금액을 입력하세요.');el.value=old;return}battle.scores[n]=Math.round(v);if(!persistBattle()){battle.scores[n]=old;return}const after=battleLeader(),firstWin=old===0&&v>0&&BATTLE_NEW.has(n);render();if(before!=='tie'&&after!=='tie'&&before!==after)celebrate('🎉 '+BATTLE_LABEL[after]+' 역전!');else if(old<10000000&&v>=10000000)celebrate('🎊 1000만 클럽 달성!');else if(firstWin)celebrate('🐣 '+n+' 첫 계약 축하!')}
function updateBattlePreview(el){} // 입력 확정(change) 시 저장하여 오입력을 방지합니다.
function downloadBattle(){const data={...battle,exportedAt:new Date().toISOString(),note:'서울금융지사 CRM 2026년 11월 지점 환산대결 오프라인 백업'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='서울금융지사_2026_11월_환산대결_백업.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBattleFile(file){if(!file)return;if(file.size>2*1024*1024){alert('2MB 이하의 JSON 백업을 선택해 주세요.');return;}const reader=new FileReader();reader.onload=()=>{try{let r=JSON.parse(reader.result);if(r.period!=='2026-11'||!r.scores||typeof r.scores!=='object')throw Error('올바른 환산대결 백업 파일이 아닙니다.');for(const n of Object.keys(battle.scores)){const v=Number(r.scores[n]);if(!Number.isFinite(v)||v<0||v>999999999999)throw Error('실적 값이 올바르지 않습니다: '+n)}if(!confirm('현재 이 브라우저에 저장된 실적을 백업 내용으로 덮어쓸까요? 먼저 JSON 백업을 권장합니다.'))return;const next=battleEmpty();Object.keys(next.scores).forEach(n=>next.scores[n]=Math.round(Number(r.scores[n])));battle=next;persistBattle();render();alert('백업 데이터를 불러왔습니다.')}catch(e){alert('불러오기 실패: '+e.message)}};reader.readAsText(file,'utf-8')}
function handleBattleClick(e){const b=e.target.closest('[data-battle]');if(!b)return false;let a=b.dataset.battle;if(a==='edit'){battleEditing=!battleEditing;render()}if(a==='export')downloadBattle();if(a==='import')document.getElementById('battle-file')?.click();if(a==='reset'&&confirm('모든 환산 실적을 0원으로 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')){battle=battleEmpty();persistBattle();render()}return true}

function render(){document.getElementById('content').innerHTML=battlePage();}
document.addEventListener('click',handleBattleClick);
document.addEventListener('change',e=>{if(e.target.matches('[data-score]'))saveBattleScore(e.target);if(e.target.id==='battle-file'){importBattleFile(e.target.files?.[0]);e.target.value='';}});
window.addEventListener('storage',e=>{if(e.key===BATTLE_KEY&&!battleEditing){battle=battleLoad();render();}});
render();
</script></body></html>
